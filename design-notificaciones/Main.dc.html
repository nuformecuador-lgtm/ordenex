<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #12233f;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #d4530d; }
    a:hover { color: #b8460b; }
    .accion-btn:hover { background: #d4530d; }
    .link-btn:hover { color: #12233f; }
  </style>
</helmet>

<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">

  <!-- Panel -->
  <div style="width: 400px; background: #ffffff; border: 1px solid #e3e8f2; border-radius: 10px; box-shadow: 0 10px 30px -12px rgba(18, 35, 63, 0.28); overflow: hidden; display: flex; flex-direction: column;">

    <!-- Cabecera -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #e3e8f2;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12233f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Notificaciones</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <button type="button" class="link-btn" style="border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 12px; font-weight: 500; color: #4a5368; cursor: pointer;">Marcar leídas</button>
        <button type="button" style="border: 0; background: transparent; padding: 4px; border-radius: 8px; color: #4a5368; cursor: pointer; display: flex;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg>
        </button>
      </div>
    </div>

    <!-- Filtro: la separación que hoy no existe -->
    <div style="display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-bottom: 1px solid #e3e8f2; background: #f7f8fc;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #12233f; color: #ffffff; font-size: 12px; font-weight: 600;">
        Requieren tu acción
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #f26419; color: #ffffff; font-size: 10px; font-weight: 700;">{{conteoAccion}}</span>
      </span>
      <span style="padding: 5px 10px; border-radius: 999px; color: #4a5368; font-size: 12px; font-weight: 500;">Todas · {{conteoTotal}}</span>
    </div>

    <!-- Bloque accionable -->
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{accionables}}" as="item" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e3e8f2;">

          <!-- Icono en pastilla semántica -->
          <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{item.soft}};">
            <sc-if value="{{item.esAlerta}}" hint-placeholder-val="{{true}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.tinta}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
            </sc-if>
            <sc-if value="{{item.esAviso}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.tinta}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
            </sc-if>
            <sc-if value="{{item.esCaja}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.tinta}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
            </sc-if>
          </div>

          <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <p style="margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.005em;">{{item.titulo}}</p>
            <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #4a5368;">{{item.detalle}}</p>

            <div style="display: flex; align-items: center; gap: 10px; margin-top: 2px;">
              <sc-if value="{{item.tieneAtajo}}" hint-placeholder-val="{{true}}">
                <button type="button" class="accion-btn" style="border: 0; border-radius: 8px; background: #f26419; color: #ffffff; font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                  {{item.accion}}
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
              </sc-if>
              <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: #4a5368;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                {{item.cuando}}
              </span>
            </div>
          </div>

          <button type="button" style="flex-shrink: 0; border: 0; background: transparent; padding: 2px; height: 20px; border-radius: 6px; color: #4a5368; cursor: pointer; display: flex;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <!-- Bloque informativo -->
    <div style="padding: 10px 16px 6px; background: #f7f8fc; border-bottom: 1px solid #e3e8f2;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #4a5368;">Para tu información</span>
    </div>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{informativas}}" as="item" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px; border-bottom: 1px solid #e3e8f2;">
          <div style="flex-shrink: 0; width: 6px; height: 6px; border-radius: 999px; background: #e3e8f2; margin-top: 6px;"></div>
          <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #12233f;">{{item.titulo}}</p>
            <span style="font-size: 11.5px; color: #4a5368;">{{item.cuando}}</span>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"rol":{"editor":"enum","options":["Tienda","Admin de bodega","Mensajero","Maestro"],"default":"Tienda","section":"Contenido"}}'>
class Component extends DCLogic {
  renderVals() {
    const rol = this.props.rol ?? "Tienda";

    const ALERTA = { soft: "#fee2e2", tinta: "#b91c1c", esAlerta: true, esAviso: false, esCaja: false };
    const AVISO  = { soft: "#fef3c7", tinta: "#92400e", esAlerta: false, esAviso: true,  esCaja: false };
    const CAJA   = { soft: "#eff6ff", tinta: "#1d4ed8", esAlerta: false, esAviso: false, esCaja: true  };

    const porRol = {
      "Tienda": {
        accionables: [
          { ...ALERTA, titulo: "5 novedades esperan tu decisión",
            detalle: "La más antigua lleva 3 días en bodega. A los 5 días se rechazan automáticamente.",
            accion: "Gestionar novedades", cuando: "hace 2 h" },
          { ...AVISO, titulo: "2 direcciones no se pudieron ubicar",
            detalle: "El mapa no las reconoce. Añadí una referencia para que se puedan repartir.",
            accion: "Corregir direcciones", cuando: "hace 6 h" },
        ],
        informativas: [
          { titulo: "Carga masiva terminada · 120 órdenes, 3 con error", cuando: "hace 3 h" },
          { titulo: "18 órdenes salieron a reparto hoy", cuando: "hace 8 h" },
        ],
      },
      "Admin de bodega": {
        accionables: [
          { ...AVISO, titulo: "12 órdenes esperan volver a su tienda",
            detalle: "La más antigua lleva 6 días en bodega. Coordiná la devolución.",
            accion: "Ver devoluciones", cuando: "hace 5 h" },
          { ...CAJA, titulo: "Cierre del día pendiente de aprobar",
            detalle: "Johel Hernández · ₡184.500 en efectivo, 23 gestiones.",
            accion: "Revisar cierre", cuando: "hace 1 h" },
        ],
        informativas: [
          { titulo: "3 órdenes quedaron sin mensajero al cerrar el día", cuando: "hace 9 h" },
          { titulo: "Bodega San Ramón solicitó consolidar", cuando: "ayer" },
        ],
      },
      "Mensajero": {
        accionables: [
          { ...ALERTA, titulo: "Tu cierre del lunes quedó vencido",
            detalle: "Se cerró sin que lo enviaras. Resolvelo hoy o vas a quedar bloqueado.",
            accion: "Ver mi cierre", cuando: "hace 40 min" },
          { ...CAJA, titulo: "Le cambiaron el día de reparto a 2 órdenes tuyas",
            detalle: "Pasaron a mañana. Revisá tu lista antes de salir para no llevar lo que ya no toca.",
            accion: "Ver mi reparto", cuando: "hace 3 h" },
        ],
        informativas: [
          { titulo: "Se retiró la guía 41270372 de tu ruta", cuando: "hace 5 h" },
        ],
      },
      "Maestro": {
        accionables: [
          { ...ALERTA, titulo: "El servicio de mapas lleva 2 h rechazando peticiones",
            detalle: "43 direcciones sin ubicar. Es nuestra credencial, no las direcciones: se arregla fuera de la app.",
            accion: "", tieneAtajo: false, cuando: "hace 15 min" },
          { ...AVISO, titulo: "Un webhook lleva fallando en racha",
            detalle: "Sus reintentos se espaciaron solos. Sigue activo y se recupera al primer envío correcto.",
            accion: "Ver suscripción", cuando: "hace 4 h" },
        ],
        informativas: [
          { titulo: "2 postulaciones de mensajero sin revisar", cuando: "ayer" },
          { titulo: "Nuform concentra el 61 % de las devoluciones del mes", cuando: "hace 2 d" },
        ],
      },
    };

    const set = porRol[rol] ?? porRol["Tienda"];
    // Un aviso puede requerir accion y NO tener a donde llevarte: el servicio de mapas
    // caido se arregla fuera de la app, asi que ahi no se pinta boton. Un atajo que no
    // resuelve nada enseña a ignorar los que si.
    const accionables = set.accionables.map((a) => ({ ...a, tieneAtajo: a.tieneAtajo !== false }));
    return {
      accionables,
      informativas: set.informativas,
      conteoAccion: accionables.length,
      conteoTotal: accionables.length + set.informativas.length,
    };
  }
}
</script>
</body>
</html>
