# Feature 106 — OpenAPI 3.1 del canal integrador por API key (Ordenex).
# GENERADO desde lib/api/openapi-spec.ts (fuente de verdad). No editar a mano:
# regenerar con `pnpm tsx <script>` si cambia el objeto TS.
openapi: 3.1.0
info:
  title: Ordenex — API de integración por API key
  version: 1.0.0
  description: |-
    Canal de integración por **API key** para crear, listar, consultar, cancelar y eliminar órdenes.

    Autenticación: todos los endpoints exigen el header `Authorization: Bearer ordx_...`
    La key identifica a un usuario dedicado que es el **dueño**
    de las órdenes: cada llamada opera SIEMPRE sobre las órdenes de ese dueño y sobre ninguna
    otra. El dueño de la key **solo ve y opera sus propias órdenes**; nunca se puede ampliar el
    alcance (un `tiendaId`/`owner` en la query se ignora).

    Aislamiento: una orden inexistente y una orden de otro dueño devuelven el **mismo 404**;
    la API no revela la existencia de recursos ajenos.

    Errores: shape uniforme del manejador global — ver el schema `Error`.
security:
  - bearerAuth: []
tags:
  - name: Órdenes
    description: "Carga, listado, detalle y cancelación de órdenes propias."
paths:
  "/api/ordenes/api-key/carga":
    post:
      tags:
        - Órdenes
      summary: Carga de órdenes
      operationId: cargarOrdenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CargaRequest"
            examples:
              dosFilas:
                summary: "Dos filas (una válida, una con teléfono faltante)"
                value:
                  ordenes:
                    - num_remision: "REM-0001"
                      destinatario: Juan Pérez
                      telefono: "88887777"
                      provincia: San José
                      canton: San José
                      distrito: Carmen
                      direccion: "Av. Central, 200m norte del parque"
                      producto: Camiseta talla M
                      peso: "1.5"
                      monto_cobrar: "25.90"
                      notas: Entregar en la tarde
                    - num_remision: "REM-0002"
                      destinatario: María Solís
                      telefono: ""
                      provincia: San José
                      canton: Escazú
                      distrito: San Rafael
                      direccion: "Multiplaza, local 12"
                      producto: Zapatos talla 38
                      peso: "0.8"
                      monto_cobrar: "40.00"
                      notas: ""
      responses:
        "200":
          description: Lote procesado (puede incluir filas con error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaResponse"
              examples:
                resumen:
                  summary: "Una creada, una con error"
                  value:
                    cargaId: "9c2b7f10-5d3a-4e21-9a4b-77c8e0f1a2b3"
                    total: 2
                    creadas: 1
                    duplicadas: 0
                    conError: 1
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        resultado: creada
                        estatus: por_recolectar_en_tienda
                        numGuia: 100234
                    errores:
                      - fila: 2
                        numRemision: "REM-0002"
                        resultado: error
                        errores:
                          telefono:
                            - requerido
                    ordenes:
                      - id: "6f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
                        numRemision: "REM-0001"
                        numGuia: 100234
                        estado: por_recolectar_en_tienda
                        costoEnvio: "3.39"
                        fulfillment: "0.00"
                filaSinTarifa:
                  summary: "Una creada y una degradada por falta de tarifa"
                  value:
                    cargaId: "9c2b7f10-5d3a-4e21-9a4b-77c8e0f1a2b3"
                    total: 2
                    creadas: 1
                    duplicadas: 0
                    conError: 1
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        resultado: creada
                        estatus: por_recolectar_en_tienda
                        numGuia: 100234
                    errores:
                      - fila: 2
                        numRemision: "REM-0002"
                        resultado: error
                        errores:
                          tarifa:
                            - "no hay tarifa vigente para la zona de esta fila"
                    ordenes:
                      - id: "6f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
                        numRemision: "REM-0001"
                        numGuia: 100234
                        estado: por_recolectar_en_tienda
                        costoEnvio: "3.39"
                        fulfillment: "0.00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        # Feature 274 (R29/R31) — el 409 NUEVO de la carga. No es `$ref: Conflict` a secas
        # porque el ejemplo publicado tiene que ser la MISMA cadena que el service emite
        # (`lib/services/mensajes-tarifa.ts`, `MSG_CARGA_SIN_TARIFA`).
        "409":
          description: "Ninguna de las filas que llegaron a la resolución de tarifa la resolvió: no se creó ninguna orden ni fila de carga."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: CONFLICT
                message: "la tienda no tiene una tarifa vigente asociada: no se pueden crear órdenes"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key":
    get:
      tags:
        - Órdenes
      summary: Listado paginado de órdenes propias
      operationId: listarOrdenes
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad de items por página (1..100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: "Cantidad de items a saltar (>= 0)."
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          required: false
          description: Filtra por estado exacto del catálogo.
          schema:
            type: string
            enum:
              - entregada
              - devuelta
              - devolviendo_a_tienda
              - reprogramada
              - por_recolectar_en_tienda
              - en_ruta_bodega_central
              - en_bodega_central
              - en_preparacion
              - por_recoger
              - en_ruta_bodega_satelite
              - en_reparto
              - rechazada
              - en_bodega_satelite
              - devuelta_a_tienda
              - ayuda_tienda
              - incidente
        - name: desde
          in: query
          required: false
          description: "Fecha calendario mínima de creación (`YYYY-MM-DD`), inclusiva; el día se mide en hora de Costa Rica (UTC-6)."
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: hasta
          in: query
          required: false
          description: "Fecha calendario máxima de creación (`YYYY-MM-DD`), inclusiva; el día se mide en hora de Costa Rica (UTC-6), así que cubre las 24 horas completas de ese día."
          schema:
            type: string
            format: date
            example: "2026-08-21"
        - name: num_guia
          in: query
          required: false
          description: Filtra por número de guía exacto. Excluye las órdenes que aún no tienen guía asignada.
          schema:
            type: integer
            minimum: 1
            example: 100234
        - name: num_remision
          in: query
          required: false
          description: "Filtra por número de remisión exacto (sin prefijo, sin subcadena, distingue mayúsculas)."
          schema:
            type: string
            minLength: 1
            example: "REM-0001"
      responses:
        "200":
          description: Página de órdenes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listado"
              examples:
                pagina:
                  summary: Primera página con un item
                  value:
                    items:
                      - numGuia: 100234
                        numRemision: "REM-0001"
                        estado: en_ruta_bodega_central
                        destinatario: Juan Pérez
                        telefonoDest: "88887777"
                        producto: Camiseta talla M
                        direccion: "Av. Central, 200m norte del parque"
                        montoCobrar: 25.9
                        createdAt: "2026-07-22T14:03:11.000Z"
                    pagination:
                      limit: 50
                      offset: 0
                      total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/{numGuia}/cancelar":
    parameters:
      - name: numGuia
        in: path
        required: true
        description: Número de guía de la orden a cancelar (entero positivo).
        schema:
          type: integer
          minimum: 1
    put:
      tags:
        - Órdenes
      summary: Cancelar una orden propia
      operationId: cancelarOrden
      responses:
        "200":
          description: Orden cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelacionResponse"
              examples:
                cancelada:
                  summary: Cancelación desde en_ruta_bodega_central
                  value:
                    numGuia: 100234
                    estadoAnterior: en_ruta_bodega_central
                    estado: devolviendo_a_tienda
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision`. Si el valor casa con la guía de una orden y con la remisión de otra, gana la de la guía."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags:
        - Órdenes
      summary: Detalle de una orden propia por guía o remisión
      operationId: detalleOrdenPorIdentificador
      responses:
        "200":
          description: Detalle de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenDetalle"
              examples:
                detalle:
                  summary: Orden resuelta por su número de remisión
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: entregada
                    destinatario: Juan Pérez
                    telefonoDest: "88887777"
                    producto: Camiseta talla M
                    direccion: "Av. Central, 200m norte del parque"
                    montoCobrar: 25.9
                    createdAt: "2026-07-22T14:03:11.000Z"
                    evidencias:
                      - resultado: entregada
                        contentType: image/jpeg
                        url: "https://<proyecto>.supabase.co/storage/v1/object/sign/gestion-evidencias/..."
                        expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Órdenes
      summary: Eliminar una orden propia
      operationId: eliminarOrden
      responses:
        "200":
          description: Orden eliminada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EliminacionResponse"
              examples:
                conGuia:
                  summary: Orden ya numerada, eliminada desde en_bodega_central
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: en_bodega_central
                sinGuia:
                  summary: Orden recién cargada, todavía sin guía
                  value:
                    numGuia: null
                    numRemision: "REM-0002"
                    estado: en_preparacion
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}/generate":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision` (misma resolución que el endpoint de detalle)."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      tags:
        - Órdenes
      summary: PDF de etiqueta de una orden propia
      operationId: generarPdfOrden
      responses:
        "200":
          description: URL firmada del PDF de la etiqueta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                primeraLlamada:
                  summary: "Primera llamada: el PDF se construye"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                reuso:
                  summary: "Llamada posterior: solo se vuelve a firmar (misma forma)"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/carga/{cargaId}/generate":
    parameters:
      - name: cargaId
        in: path
        required: true
        description: "Id del lote, tal como lo devuelve `cargaId` en la respuesta de `POST /api/ordenes/api-key/carga`."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Órdenes
      summary: PDF consolidado de etiquetas de un lote propio
      operationId: generarPdfCarga
      responses:
        "200":
          description: URL firmada del PDF consolidado del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                consolidado:
                  summary: Consolidado del lote recién construido
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  # Feature 255 (R47) — OCTAVO endpoint del canal: cotización previa, lectura pura.
  "/api/ordenes/api-key/cotizacion":
    post:
      tags:
        - Órdenes
      summary: "Cotización de un lote (no crea nada)"
      operationId: cotizarOrdenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizacionRequest"
            examples:
              dosFilas:
                summary: "Dos filas (una con cobertura, una con distrito inexistente)"
                value:
                  ordenes:
                    - provincia: San José
                      canton: Escazú
                      distrito: San Rafael
                      direccion: "Multiplaza, local 12"
                      monto_cobrar: "25900"
                      num_remision: "REM-0001"
                    - provincia: San José
                      canton: Escazú
                      distrito: Distrito que no existe
                      direccion: Sin referencia
                      monto_cobrar: "18000"
      responses:
        "200":
          description: Lote cotizado (puede incluir filas con error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CotizacionResponse"
              examples:
                resumen:
                  summary: "Una cotizada (con sus dos escenarios) y una con error"
                  value:
                    total: 2
                    cotizadas: 1
                    conError: 1
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        montoCobrar: "25900.00"
                        resultado: cotizada
                        costos:
                          entregado:
                            flete: "2500.00"
                            iva: "325.00"
                            comision: "906.50"
                            ivaComision: "117.85"
                            fulfillment: "0.00"
                            total: "22050.65"
                          devuelto:
                            flete: "1396.46"
                            iva: "181.54"
                            comision: "0.00"
                            fulfillment: "0.00"
                            total: "-1578.00"
                    errores:
                      - fila: 2
                        numRemision: null
                        resultado: error
                        errores:
                          distrito:
                            - distrito no encontrado en el canton
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Ninguna de las filas que llegaron a la resolución de tarifa la resolvió: no se cotiza ninguna fila."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: CONFLICT
                message: "la tienda no tiene una tarifa vigente asociada: no se puede cotizar"
        "422":
          $ref: "#/components/responses/ValidationError"
  # Feature 267 (R39) — NOVENO endpoint del canal: la analítica de las propias órdenes.
  # Espejo textual de `openApiSpec.paths["/api/ordenes/api-key/analitica"]`, misma posición
  # (novena) y mismo contenido: el `.yaml` es un archivo de texto y nada más lo mantiene
  # sincronizado con el objeto TS.
  "/api/ordenes/api-key/analitica":
    get:
      tags:
        - Órdenes
      summary: Series diarias de tus métricas sobre tus órdenes
      operationId: consultarAnalitica
      parameters:
        - name: metricas
          in: query
          required: false
          description: "Ids separados por comas, o `all` para todas las publicables. Si se omite (o se manda vacío) equivale a `all`. Solo los valores del enum se publican por este canal; `all` no se combina con ids."
          schema:
            type: string
            enum:
              - ordenes_creadas
              - ordenes_por_estado
              - entregas
              - devoluciones
              - rechazos
              - reprogramaciones
              - tasa_entrega
              - tasa_devolucion
              - tasa_rechazo
              - tiempo_ciclo
              - all
          example: entregas,devoluciones
        - name: desde
          in: query
          required: false
          description: "Fecha calendario de Costa Rica (UTC-6), INCLUSIVA (`>=`). Formato `YYYY-MM-DD`. Si se omite, la serie arranca en el primer día del que hay datos."
          schema:
            type: string
            format: date
          example: "2026-08-01"
        - name: hasta
          in: query
          required: false
          description: "Fecha calendario de Costa Rica (UTC-6), INCLUSIVA (`<=`). Formato `YYYY-MM-DD`. Si se omite, la serie llega hasta hoy. No hay tope de tamaño de ventana."
          schema:
            type: string
            format: date
          example: "2026-08-21"
      responses:
        "200":
          description: "Series diarias de las métricas pedidas, sobre tus órdenes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnaliticaRespuesta"
              examples:
                serie:
                  summary: "Dos métricas; se pidieron tres días y el tercero (hoy) no viene: no está cerrado"
                  value:
                    rango:
                      desde: "2026-08-19"
                      hasta: "2026-08-21"
                    metricas:
                      - metrica: entregas
                        unidad: conteo
                        data:
                          - fecha: "2026-08-19"
                            valor: 41
                          - fecha: "2026-08-20"
                            valor: 37
                      - metrica: tasa_entrega
                        unidad: porcentaje
                        data:
                          - fecha: "2026-08-19"
                            valor: 0.93
                          - fecha: "2026-08-20"
                            valor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  # Feature 266 (T7.1, R28) — HABILITACIÓN POR LOTE de pedidos con novedad. Espejo textual de
  # `openApiSpec.paths["/api/ordenes/api-key/habilitar"]`.
  "/api/ordenes/api-key/habilitar":
    post:
      tags:
        - Órdenes
      summary: "Habilitar pedidos con novedad (lote)"
      operationId: habilitarOrdenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabilitacionRequest"
            examples:
              dosFilas:
                summary: "Dos filas: una en ayuda con mensajero y una devuelta"
                value:
                  ordenes:
                    - num_guia: 100234
                      nota: "el cliente pidió reintento mañana"
                    - num_guia: 100235
                      nota: "dirección corregida por el call center"
      responses:
        "200":
          description: "Lote procesado (puede incluir filas con error)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabilitacionResponse"
              examples:
                resumen:
                  summary: "Una habilitada, una sin cambio de estado y una con error"
                  value:
                    resumen:
                      total: 3
                      habilitadas: 1
                      habilitadasSinCambioDeEstado: 1
                      conError: 1
                    resultados:
                      - numGuia: 100234
                        resultado: habilitada
                        estado: en_reparto
                        error: null
                      - numGuia: 100235
                        resultado: habilitada_sin_cambio_de_estado
                        estado: devuelta
                        error: null
                      - numGuia: 999999
                        resultado: error
                        estado: null
                        error:
                          codigo: no_encontrada
                          mensaje: "no existe una orden viva con esa guia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
# Feature 256/R24 — WEBHOOKS SALIENTES. Sección de NIVEL SUPERIOR de OpenAPI 3.1 (fuera de
# `paths:`): lo que Ordenex ENVÍA al callback del integrador, no lo que el integrador pide.
# Espejo textual de `openApiSpec.webhooks` (lib/api/openapi-spec.ts).
#
# ⏳ 2026-08-22 (FEATURE 268/R28/R29/R30) — AQUÍ DECÍA, y ya no es cierto:
# «El campo `data.estado` va como `type: string` con prosa y SIN `enum` de estados a propósito
# (design 256 §5.2)».
# Ahora SÍ lleva `enum`, DERIVADO de `EVENTOS_PUBLICOS` (`lib/types/webhook-eventos.ts`) y con
# orden alfabético determinista: son los 12 values que este webhook puede emitir de verdad, un
# SUBCONJUNTO del catálogo de `OrdenListItem.estado`. El miedo de la 256 —«sería un 5.º catálogo
# de estados y pondría roja `openapi-contrato-en-reparto.test.ts`»— era infundado: esa guardia
# cuenta enums con el predicado `esEnumDeEstado`, que exige `entregada` **Y** el estado interno de
# recogida; este enum no lleva el segundo, así que no entra en el recuento y los bloques siguen
# siendo CUATRO. Lo verifica `tests/unit/api/openapi-webhook-contrato.test.ts`, no la fe.
# El bloque `data` gana además la clave OPCIONAL `evidenciasUrl` (R24) y `motivo` amplía su enum
# con las tres causas de incidente, en español (R20).
#
# La prosa evita la subcadena «intentos» a proposito: `tests/unit/types/intentos-no-alcance.test.ts`
# (160/R31) la prohibe en todo el contrato.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key en el header `Authorization: Bearer <tu-api-key>`."
  schemas:
    # Feature 99/256/268 — PAYLOAD del evento saliente `orden.estado_actualizado`. Vive aqui y no
    # como entrada de `webhooks`: esa seccion se pinta como un endpoint mas y este evento no es
    # algo que el integrador llame. Se publica la FORMA, no una operacion.
    WebhookOrdenEstadoActualizado:
      type: object
      required:
        - evento
        - eventoId
        - ocurridoAt
        - data
      properties:
        evento:
          type: string
          const: orden.estado_actualizado
          description: Nombre del evento. Estable.
        eventoId:
          type: string
          description: "Identificador determinista del evento (`webhook_estado:<ordenId>:<estatusDestinoId>:<ocurridoAt>`). Dos entregas del MISMO cambio de estado lo repiten: deduplicá por este valor."
        ocurridoAt:
          type: string
          format: date-time
          description: "Instante del cambio de estado (ISO 8601, UTC)."
        data:
          type: object
          # ⏳ 2026-08-22 (feature 268/R28) — la frase de la 256 decia «las cuatro claves
          # están SIEMPRE presentes» a secas. Sigue siendo verdad para esas cuatro, pero ya
          # no describe el objeto entero: hay una QUINTA clave, `evidenciasUrl`, que es
          # OPCIONAL y se OMITE salvo en `incidente`. Se dice cual es cual.
          description: "Las cuatro claves `numGuia`, `numRemision`, `estado` y `motivo` están SIEMPRE presentes, sea cual sea el estado: el consumidor no ramifica por estado para saber si existen (`motivo` viaja como `null` cuando no aplica, nunca omitido). A ellas se suma UNA clave OPCIONAL, `evidenciasUrl`, que SÍ se omite salvo en los eventos con `estado: \"incidente\"`."
          required:
            - numGuia
            - numRemision
            - estado
            - motivo
          properties:
            numGuia:
              type:
                - integer
                - "null"
              description: Número de guía de la orden (null si aún no está asignado).
            numRemision:
              type: string
              description: Remisión de la orden (la que envió el integrador).
            estado:
              type: string
              # feature 268/R29: DERIVADO de `EVENTOS_PUBLICOS`, nunca copiado a mano.
              # Contiene `entregada` pero NO el estado interno de recogida, asi que
              # `esEnumDeEstado` de `openapi-contrato-en-reparto.test.ts` NO lo cuenta:
              # los bloques de catalogo siguen siendo CUATRO.
              enum:
                - ayuda_tienda
                - devolviendo_a_tienda
                - devuelta
                - devuelta_a_tienda
                - en_bodega_central
                - en_preparacion
                - en_reparto
                - en_ruta_bodega_central
                - entregada
                - incidente
                - por_recolectar_en_tienda
                - rechazada
                - reprogramada
              description: "Estado destino de la orden, con el MISMO value crudo del catálogo que publica `OrdenListItem.estado` (y, por herencia, `OrdenDetalle`). El `enum` de arriba es la POLÍTICA de eventos públicos: la lista EXACTA y COMPLETA de values que este webhook puede entregar, y un SUBCONJUNTO del catálogo de `OrdenListItem.estado`. Los estados internos de ruteo satélite que ese catálogo documenta (`por_recoger`, `en_bodega_satelite`, `en_ruta_bodega_satelite`) NO viajan nunca en un evento. `en_preparacion` SÍ viaja, y solo como evento de NACIMIENTO: es el estado inicial de las órdenes creadas con `fulfillment` (el paquete ya está en bodega), llega una única vez por orden y con `numGuia: null`, porque en esa rama la guía se emite más tarde. La lista puede CRECER de forma aditiva en el futuro, siempre con aviso previo: tratá un value desconocido como «ignorar», no como error."
            motivo:
              type:
                - string
                - "null"
              enum:
                - not_found
                - wrong_number
                - wrong_address
                - danado
                - perdido
                - robado
                - null
              description: |-
                Causa TIPIFICADA del cambio de estado, con el value crudo del enum y sin traducir. El
                campo transporta DOS enums distintos y cuál aplica lo decide `estado`:

                - **`estado: "devuelta"`** → causa de la devolución: `not_found` (destinatario no
                  encontrado), `wrong_number` (teléfono equivocado), `wrong_address` (dirección
                  equivocada). Estos tres NO aparecen nunca con otro estado.
                - **`estado: "incidente"`** → causa del incidente: `danado`, `perdido`, `robado`. Estos
                  tres NO aparecen nunca con otro estado.
                - **cualquier otro `estado`** → siempre `null`.

                ⚠️ **La asimetría de idioma es DELIBERADA, no un error que corregir.** Las causas de
                devolución van en INGLÉS y las de incidente en ESPAÑOL (`danado` sin eñe, `perdido`,
                `robado`) porque cada enum se publicó con el value crudo de su catálogo interno y
                renombrar cualquiera de los dos rompería a los integradores que ya lo consumen.
                Decisión consciente y firmada (73/F1.4-g y 158/Q-B): no se «armoniza» en el futuro.

                Es `null` en todo evento cuyo `estado` NO sea `devuelta` ni `incidente`, y es `null`
                **también** en una `devuelta` (o un `incidente`) sin causa registrada — órdenes cerradas
                antes de que la causa se pidiera; ese histórico no se rellenó. El contrato no distingue
                «no hubo causa» de «no se registró»:
                en los dos casos viaja `null`, el campo NUNCA se omite y la entrega es normal.

                **Es el motivo VIGENTE EN EL MOMENTO DE LA ENTREGA**, no una foto del instante del
                cambio de estado: el webhook dice exactamente lo mismo que dice la aplicación en ese
                instante. Si la devolución se re-gestiona entre dos entregas del mismo `eventoId`, la
                segunda lleva la causa vigente entonces; deduplicá por `eventoId` y quedate con la
                última entrega.

                ⚠️ Transporta EXCLUSIVAMENTE la causa tipificada. NO es el texto libre que el mensajero
                escribe al gestionar la orden —que comparte el nombre `motivo` en la base de datos y NO
                se emite NUNCA en este webhook—, ni ningún otro dato del destinatario.
            # feature 268/R24/R30 — la QUINTA clave, y la unica OPCIONAL del objeto:
            # deliberadamente FUERA de `required`.
            evidenciasUrl:
              type: string
              format: uri
              description: |-
                Enlace al detalle de esta orden en el canal por API key
                (`GET /api/ordenes/api-key/orden/{id}`), cuyo array `evidencias[]` incluye las
                evidencias del incidente con `resultado: "incidente"`.

                **Es el único campo OPCIONAL de `data`.** Viaja SOLO en los eventos con
                `estado: "incidente"`, y se OMITE —no viaja como `null`— tanto en cualquier otro
                estado como en un `incidente` para el que no se pueda resolver el enlace. Ramificá
                por «la clave existe», no por su valor.

                ⚠️ **NO es una URL firmada y NO lleva credencial.** Es un enlace ESTABLE y
                determinista: sin token, sin expiración, no caduca, y las dos entregas de un mismo
                `eventoId` (por ejemplo tras un reintento) llevan exactamente el mismo valor. Por eso
                **no podés abrirlo sin autenticarte**: invocalo con tu propio
                `Authorization: Bearer ordx_...`, igual que cualquier otra llamada al canal, y el
                detalle te devolverá las URLs firmadas frescas de las fotos, con su TTL corto. La
                credencial la ponés vos; el cuerpo del webhook nunca la transporta.
      # feature 268/R30 — el ejemplo de la 256 (`devuelta`/`not_found`) NO se pierde: es el
      # primero de la lista, y se le suma el caso de `incidente`, que es el unico que muestra la
      # clave opcional `evidenciasUrl` y la causa en español.
      examples:
        - evento: orden.estado_actualizado
          eventoId: "webhook_estado:018f2c31-0000-4000-8000-000000000001:7:2026-08-21T10:00:00.000Z"
          ocurridoAt: "2026-08-21T10:00:00.000Z"
          data:
            numGuia: 100234
            numRemision: "REM-0001"
            estado: devuelta
            motivo: not_found
        - evento: orden.estado_actualizado
          eventoId: "webhook_estado:018f2c31-0000-4000-8000-000000000002:21:2026-08-22T14:30:00.000Z"
          ocurridoAt: "2026-08-22T14:30:00.000Z"
          data:
            numGuia: 100235
            numRemision: "REM-0002"
            estado: incidente
            motivo: robado
            evidenciasUrl: "https://app.ordenex.co/api/ordenes/api-key/orden/018f2c31-0000-4000-8000-000000000002"
    Error:
      type: object
      description: "Shape uniforme de error del manejador global. `status` siempre `\"error\"`."
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL
          description: Código estable (independiente del status HTTP).
        message:
          type: string
          description: Mensaje fijo en español.
        details:
          type: object
          description: "Detalle opcional. En 422 lleva `fieldErrors` (campo -> lista de errores)."
          additionalProperties: true
    OrdenListItem:
      type: object
      description: Item público de una orden propia (sin ids internos ni PII de terceros).
      required:
        - numGuia
        - numRemision
        - estado
        - destinatario
        - telefonoDest
        - producto
        - direccion
        - montoCobrar
        - createdAt
      properties:
        numGuia:
          type:
            - integer
            - "null"
          description: Número de guía (null si aún no asignado).
        numRemision:
          type: string
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
            - incidente
        destinatario:
          type: string
        telefonoDest:
          type: string
        producto:
          type: string
        direccion:
          type:
            - string
            - "null"
        montoCobrar:
          type:
            - number
            - "null"
          description: Monto a cobrar (COD).
        createdAt:
          type: string
          format: "date-time"
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Total de órdenes que cumplen el filtro.
    Listado:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrdenListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Evidencia:
      type: object
      # feature 268/R31: espejo del objeto TS — las evidencias del INCIDENTE (mensajero y admin)
      # se exponen con la MISMA forma, y por eso `resultado` gana un tercer value.
      description: "Evidencia de entrega, rechazo o incidente, con URL firmada de corta duración. Las de incidente llegan con `resultado: \"incidente\"` y son las que enlaza el campo `evidenciasUrl` del webhook."
      required:
        - resultado
        - contentType
        - url
        - expiraEnSegundos
      properties:
        resultado:
          type: string
          enum:
            - entregada
            - rechazada
            - incidente
        contentType:
          type:
            - string
            - "null"
          description: MIME del archivo (p. ej. image/jpeg).
        url:
          type: string
          format: uri
          description: URL firmada (vence a los 5 min).
        expiraEnSegundos:
          type: integer
          description: TTL de la URL firmada en segundos (300).
    OrdenDetalle:
      allOf:
        - $ref: "#/components/schemas/OrdenListItem"
        - type: object
          required:
            - evidencias
          properties:
            evidencias:
              type: array
              description: "Evidencias de la orden ([] si no hay)."
              items:
                $ref: "#/components/schemas/Evidencia"
    CargaRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 5000
          description: Filas a cargar (1..5000). Todos los valores son texto.
          items:
            $ref: "#/components/schemas/CargaRow"
    CargaRow:
      type: object
      description: "Una fila de carga. Todas las claves son strings. Las requeridas se validan en el servidor; una fila inválida no aborta el lote (se reporta como `error`)."
      required:
        - num_remision
        - destinatario
        - telefono
        - provincia
        - canton
        - distrito
        - direccion
        - producto
        - peso
        - monto_cobrar
      properties:
        num_remision:
          type: string
          description: Identificador de remisión (dedup por este valor).
        destinatario:
          type: string
        telefono:
          type: string
        provincia:
          type: string
        canton:
          type: string
        distrito:
          type: string
        direccion:
          type: string
        producto:
          type: string
        peso:
          type: string
          description: "Peso en kg como texto (p. ej. \"1.5\")."
        monto_cobrar:
          type: string
          description: "Monto COD como texto (p. ej. \"25.90\")."
        notas:
          type: string
      additionalProperties:
        type: string
    CargaRowResult:
      type: object
      description: "Resultado de una fila que SÍ entró al sistema. Desde 2026-08-31 esta lista no contiene filas en `error`: ésas viajan en `errores` (`CargaFilaError`)."
      required:
        - fila
        - numRemision
        - resultado
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type: string
        resultado:
          type: string
          enum:
            - creada
            - duplicada
        estatus:
          type: string
          description: Estado (en creada/duplicada); nunca ids internos.
        numGuia:
          type: integer
          description: "Número de guía asignado (solo en `creada`)."
    # 2026-08-31 — la fila que NO entró, publicada aparte. Es el MISMO objeto que antes viajaba
    # dentro de `filas`; lo único que cambió es dónde se lee. Schema propio (y no `CargaRowResult`)
    # porque aquí `errores` es REQUIRED: en esta lista no existe el elemento sin detalle.
    CargaFilaError:
      type: object
      description: Una fila que no se creó, con el detalle de por qué.
      required:
        - fila
        - numRemision
        - resultado
        - errores
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type: string
          description: Tu número de remisión tal como llegó (vacío si la fila no lo traía).
        resultado:
          type: string
          const: error
        errores:
          type: object
          description: "Errores por campo. Las claves suelen ser columnas de la fila, pero no siempre: la clave `tarifa` señala que el par (tienda, zona) de esa fila no resuelve tarifa vigente y por eso la orden no se creó."
          additionalProperties:
            type: array
            items:
              type: string
    CargaOrden:
      type: object
      description: Una orden efectivamente creada (bloque plano listo para consumir).
      required:
        - id
        - numRemision
        - numGuia
        - estado
        - costoEnvio
        - fulfillment
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de la orden creada.
        numRemision:
          type: string
        numGuia:
          type:
            - integer
            - "null"
          description: "Número de guía asignado en el acto. Es `null` —y solo entonces— cuando la orden nació en `en_preparacion` por fulfillment: la guía se emite más tarde y nunca se fabrica un número."
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
            - incidente
        costoEnvio:
          type: string
          description: "Costo total del envío (flete + IVA de la tarifa vigente del par (tienda, zona), MÁS el fulfillment si lo hay), string escala 2. Toda orden creada lo trae con un importe real: una fila sin tarifa no llega a crearse. Distinto de `monto_cobrar`/COD."
        fulfillment:
          type: string
          description: "Cuánto de `costoEnvio` es el servicio de bodega, string escala 2. `\"0.00\"` si tu tarifa no tiene fulfillment — y entonces `costoEnvio` es solo flete + IVA. Nunca `null`."
    CargaResponse:
      type: object
      required:
        - total
        - creadas
        - duplicadas
        - conError
        - filas
        - errores
        - ordenes
      properties:
        cargaId:
          type:
            - string
            - "null"
          format: uuid
          description: "Id del lote creado, para pedir después el PDF consolidado. `null` si el lote no creó ninguna orden."
        total:
          type: integer
          description: Filas recibidas.
        creadas:
          type: integer
        duplicadas:
          type: integer
        conError:
          type: integer
        filas:
          type: array
          description: "Las filas que entraron: `creada` y `duplicada`. Nunca contiene una fila en `error`."
          items:
            $ref: "#/components/schemas/CargaRowResult"
        errores:
          type: array
          description: "Las filas que NO se crearon, con su detalle por campo. Lista vacía cuando el lote entero entró; su longitud es siempre `conError`."
          items:
            $ref: "#/components/schemas/CargaFilaError"
        ordenes:
          type: array
          items:
            $ref: "#/components/schemas/CargaOrden"
    CancelacionResponse:
      type: object
      required:
        - numGuia
        - estadoAnterior
        - estado
      properties:
        numGuia:
          type: integer
        estadoAnterior:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
            - incidente
        estado:
          type: string
          const: devolviendo_a_tienda
    EliminacionResponse:
      type: object
      required:
        - numGuia
        - numRemision
        - estado
      properties:
        numGuia:
          type:
            - integer
            - "null"
          description: "Guía de la orden eliminada; `null` si aún no tenía."
        numRemision:
          type: string
          description: "Tu número de remisión. Vuelve a quedar libre para reutilizarlo."
        estado:
          type: string
          description: "Estado que la orden tenía al eliminarla (eliminar no cambia el estado)."
          enum:
            - en_preparacion
            - por_recolectar_en_tienda
            - recolectando
            - en_bodega_central
            - en_ruta_bodega_central
            - en_ruta_bodega_satelite
            - por_recoger
    PdfGenerateResponse:
      type: object
      description: "URL firmada de corta duración con el PDF de etiqueta (de una orden o de un lote). La URL se firma en cada llamada: nunca es una URL persistida."
      required:
        - url
        - expiraEnSegundos
      properties:
        url:
          type: string
          format: uri
          description: URL firmada del PDF.
        expiraEnSegundos:
          type: integer
          description: "TTL de la URL firmada en segundos (300 por defecto)."
    # Feature 255 — cotización previa (lectura pura). Todos los importes son STRINGS
    # money-safe CRUDOS (sin símbolo ni miles, punto decimal, exactamente 2 decimales):
    # NO existe un campo formateado en paralelo. Enmendado por la ficha 319 (2026-08-28),
    # que invirtió cuál de las dos formas se sirve.
    CotizacionRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 5000
          description: "Filas a cotizar (1..5000, el mismo tope que la carga). Todos los valores son texto."
          items:
            $ref: "#/components/schemas/CotizacionRow"
    CotizacionRow:
      type: object
      description: |-
        Una fila a cotizar. Es la MISMA fila cruda que acepta `POST /api/ordenes/api-key/carga`:
        podés mandar el cuerpo de la carga sin recortarlo y las claves que la cotización no usa
        se ignoran. `num_remision` es opcional y solo correlaciona.

        NINGUNA clave de la fila está en `required`, y es deliberado: el servidor NO rechaza el
        lote por una fila incompleta. La terna geográfica (`provincia`, `canton`, `distrito`) es
        NECESARIA para poder cotizar la fila, pero su ausencia NO es un 422 del lote: esa fila
        vuelve en la lista `errores` con `resultado: "error"` y el detalle bajo la clave del
        campo que falta, y las
        demás filas se cotizan igual (éxito parcial). Declararla `required` haría que un cliente
        generado con validación estricta rechazara EN LOCAL un cuerpo que el servidor acepta y
        responde 200.

        Cuándo recibís 422: solo por el lote entero — `ordenes` vacío o por encima del tope
        (o un valor que no sea texto). Cuándo recibís 200 con entradas en `errores`: por cualquier
        problema de una fila concreta — terna ausente o vacía, distrito no encontrado, distrito
        ambiguo, distrito sin zona asignada, o `monto_cobrar` con formato inválido.
      properties:
        provincia:
          type: string
          description: "Necesaria para cotizar la fila. Si falta, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        canton:
          type: string
          description: "Necesario para cotizar la fila. Si falta, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        distrito:
          type: string
          description: "Su zona decide la columna de flete. Necesario para cotizar la fila: si falta, no se encuentra, es ambiguo o no tiene zona, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        direccion:
          type: string
          description: Se acepta; no participa del precio.
        monto_cobrar:
          type: string
          description: "Monto COD como texto (p. ej. \"25900\"). Base de la comisión; vacío o ausente se trata como cero."
        num_remision:
          type: string
          description: "OPCIONAL: solo correlación. No se deduplica ni contra el lote ni contra las órdenes existentes."
      additionalProperties:
        type: string
    CotizacionEscenarioEntregado:
      type: object
      description: "Costo si la orden se ENTREGA: seis conceptos. `total` es lo que RECIBE la tienda = monto a cobrar − (flete + iva + comision + ivaComision + fulfillment), y es negativo si no hay COD que cubra lo facturado."
      required:
        - flete
        - iva
        - comision
        - ivaComision
        - fulfillment
        - total
      properties:
        flete:
          type: string
          description: "Flete de la zona del distrito. String money-safe de escala 2, crudo."
        iva:
          type: string
          description: "IVA del flete. String money-safe de escala 2, crudo."
        comision:
          type: string
          description: "Comisión COD. String money-safe de escala 2, crudo."
        ivaComision:
          type: string
          description: "IVA de la comisión. String money-safe de escala 2, crudo."
        fulfillment:
          type: string
          description: "Monto fijo del servicio de bodega por orden, crudo. Cero si tu tarifa no tiene fulfillment; nunca ausente."
        total:
          type: string
          description: "Lo que recibe la tienda. String money-safe de escala 2, crudo; negativo si el COD no cubre lo facturado."
    CotizacionEscenarioDevuelto:
      type: object
      description: "Costo si la orden se DEVUELVE: cinco conceptos, SIN `ivaComision` (no hay comisión que gravar). `comision` es un cero EXPLÍCITO — la afirmación de que una devolución no cobra comisión COD, no un dato ausente. `fulfillment` en cambio SÍ se cobra: el servicio de bodega ya se prestó. `total` es la DEUDA de la tienda = −(flete + iva + fulfillment), y por eso es negativo."
      required:
        - flete
        - iva
        - comision
        - fulfillment
        - total
      properties:
        flete:
          type: string
          description: "Flete de devolución. String money-safe de escala 2, crudo."
        iva:
          type: string
          description: "IVA del flete de devolución. String money-safe de escala 2, crudo."
        comision:
          type: string
          description: 'Siempre "0.00": una devolución no cobra comisión COD.'
        fulfillment:
          type: string
          description: "El MISMO monto que en el escenario entregado: preparar y despachar el paquete ya costó, lo reciba el destinatario o no. Cero si tu tarifa no tiene fulfillment."
        total:
          type: string
          description: "Deuda de la tienda. String money-safe de escala 2, crudo y negativo."
    CotizacionCostos:
      type: object
      description: "Los DOS escenarios de una fila con cobertura. Siempre presente en `filas`; las filas sin precio no lo traen porque no están en esa lista, están en `errores`."
      required:
        - entregado
        - devuelto
      properties:
        entregado:
          $ref: "#/components/schemas/CotizacionEscenarioEntregado"
        devuelto:
          $ref: "#/components/schemas/CotizacionEscenarioDevuelto"
    CotizacionRowResult:
      type: object
      description: "Una fila CON precio. No existe `duplicada`: sin persistencia no significa nada. Desde 2026-08-31 esta lista no contiene filas en `error`: ésas viajan en `errores` (`CotizacionFilaError`), y por eso `costos` dejó de ser opcional aquí."
      required:
        - fila
        - numRemision
        - montoCobrar
        - resultado
        - costos
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type:
            - string
            - "null"
          description: "El `num_remision` que mandaste, tal cual; `null` si la fila no lo trajo."
        montoCobrar:
          type: string
          description: "EL VALOR SOBRE EL QUE SE COTIZÓ: el `monto_cobrar` que entró al cálculo, ya redondeado al colón igual que lo redondea la carga, y `\"0.00\"` si la fila no traía monto (la base que usó la comisión COD). String money-safe de escala 2, crudo, como el resto de los importes."
        resultado:
          type: string
          const: cotizada
        costos:
          $ref: "#/components/schemas/CotizacionCostos"
    # 2026-08-31 — la fila que NO se cotizó, publicada aparte. Mismo objeto que antes viajaba
    # dentro de `filas`; lo único que cambió es dónde se lee. Schema propio (y no reusando
    # `CotizacionRowResult`) porque aquí `errores` es REQUIRED: en esta lista no existe el
    # elemento sin detalle, que es justo lo que la hace fácil de consumir.
    CotizacionFilaError:
      type: object
      description: "Una fila que no se pudo cotizar, con el detalle de por qué."
      required:
        - fila
        - numRemision
        - resultado
        - errores
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type:
            - string
            - "null"
          description: "El `num_remision` que mandaste, tal cual; `null` si la fila no lo trajo."
        resultado:
          type: string
          const: error
        errores:
          type: object
          description: "Errores por campo. Las claves suelen ser columnas de la fila, pero no siempre: la clave `tarifa` señala que el par (tienda, zona) de esa fila no resuelve tarifa vigente y por eso no se cotizó."
          additionalProperties:
            type: array
            items:
              type: string
    # Sin bloque `totales` (retirado el 2026-08-31): la cotización es POR ORDEN.
    CotizacionResponse:
      type: object
      required:
        - total
        - cotizadas
        - conError
        - filas
        - errores
      properties:
        total:
          type: integer
          description: Filas recibidas.
        cotizadas:
          type: integer
        conError:
          type: integer
        filas:
          type: array
          description: "Las filas con precio. Nunca contiene una fila en `error`; su longitud es siempre `cotizadas`."
          items:
            $ref: "#/components/schemas/CotizacionRowResult"
        errores:
          type: array
          description: "Las filas que NO se cotizaron, con su detalle por campo. Lista vacía cuando el lote entero se cotizó; su longitud es siempre `conError`."
          items:
            $ref: "#/components/schemas/CotizacionFilaError"
    # Feature 267 (R39) — contrato de `GET /api/ordenes/api-key/analitica`. Espejo publicado de
    # `analitica-api-key-dto.ts`: si el DTO gana o pierde un campo, este schema y el objeto TS
    # cambian con él, en el mismo commit.
    #
    # P4-bis (2026-08-23) — EL SOBRE. El endpoint sirve un LOTE, así que la unidad publicada es
    # `AnaliticaRespuesta` y no la serie suelta: el `rango` UNA vez —lo comparten todas por
    # construcción— y las series en `metricas[]`, en el orden pedido. La forma no cambia con el
    # número de métricas pedidas: un contrato que cambiara de forma obligaría a escribir dos
    # parsers para el mismo endpoint.
    AnaliticaRespuesta:
      type: object
      required:
        - rango
        - metricas
      properties:
        rango:
          type: object
          description: "Eco del rango efectivo, común a todas las series y en el mismo formato que la petición."
          required:
            - desde
            - hasta
          properties:
            desde:
              type: string
              format: date
              example: "2026-08-19"
            hasta:
              type: string
              format: date
              description: "Inclusivo, hora de Costa Rica."
              example: "2026-08-21"
        metricas:
          type: array
          description: "Una entrada por métrica pedida, en el orden pedido. Nunca vacío."
          items:
            $ref: "#/components/schemas/AnaliticaSerie"
    # 2026-08-24 — la serie publica TRES campos. `unidadDeConteo` salió del payload (es un hecho
    # del catálogo, y va en la descripción del endpoint) y `cobertura` salió entera: su
    # información la lleva ahora la OMISIÓN de puntos en `data`.
    AnaliticaSerie:
      type: object
      required:
        - metrica
        - unidad
        - data
        - cobertura
      properties:
        metrica:
          type: string
          description: Id de la métrica pedida.
          example: entregas
        unidad:
          type: string
          description: "Unidad de la cifra (p. ej. `conteo`, `porcentaje`, `dias`)."
        data:
          type: array
          description: "Los días del rango con dato, en orden, INCLUIDO el día en curso. Antes del 2026-09-04 el día en curso se omitía; ahora viene marcado `parcial: true`. ⚠️ Si sumas `data` para obtener un total del periodo, DESCARTA primero los puntos con `parcial: true` y los días listados en `cobertura.fechasNoComparables`: no son comparables con un día cerrado. Puede venir vacío, y eso es un 200 correcto. No rellenes los huecos con ceros."
          items:
            type: object
            required:
              - fecha
              - valor
            properties:
              fecha:
                type: string
                format: date
                example: "2026-08-20"
              valor:
                type:
                  - number
                  - "null"
                description: "`null` significa «no se sabe» (por ejemplo, denominador cero). NUNCA se sustituye por 0. Un día con `valor: null` SÍ está en `data`: está cerrado, pero su resultado es indefinido."
              parcial:
                type: boolean
                enum:
                  - true
                description: "Presente y `true` SOLO en el día en curso, que aún no está cerrado: su cifra se lee más baja que la de un día completo y NO es comparable. Ausente en cualquier otro día (nunca llega como `false`)."
              corteAt:
                type: string
                format: date-time
                description: "Instante ISO-8601 usado como cota superior del día parcial. Solo acompaña a `parcial: true`."
                example: "2026-08-21T18:40:00.000Z"
        cobertura:
          type: object
          description: "Qué días de esta serie no son comparables, y por qué. Siempre presente."
          required:
            - fechasNoComparables
            - penumbra
          properties:
            fechasNoComparables:
              type: array
              description: "Días del rango por debajo del horizonte del histórico: ahí un cero es falta de DATOS, no falta de operación. Normalmente vacío."
              items:
                type: string
                format: date
            penumbra:
              type: string
              enum:
                - ordenes_vivas_al_horizonte_sin_transicion_posterior
              description: "Limitación permanente del histórico, nunca estimada: las órdenes que ya estaban vivas cuando nació el historial y nunca volvieron a cambiar de estado no entran en ningún día."
    # Feature 266 (T7.1) — cuerpo y respuesta de la habilitación por lote.
    HabilitacionRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 100
          description: "Entre 1 y 100 filas. Fuera de ese rango: 422 y ninguna fila procesada."
          items:
            $ref: "#/components/schemas/HabilitacionRow"
    HabilitacionRow:
      type: object
      description: "Una fila del lote. Si `num_guia` o `nota` no cumplen, la fila responde `error`/`fila_invalida` y el resto del lote se procesa igual: NO es un 422 del lote."
      required:
        - num_guia
        - nota
      properties:
        num_guia:
          type: integer
          minimum: 1
          description: "Número de guía de una orden propia. No se acepta como texto."
        nota:
          type: string
          minLength: 1
          maxLength: 200
          description: "Motivo de la habilitación, OBLIGATORIO. Se recorta y se guarda en la bitácora de la orden; no viaja en el historial de estados."
    HabilitacionResponse:
      type: object
      required:
        - resumen
        - resultados
      properties:
        resumen:
          $ref: "#/components/schemas/HabilitacionResumen"
        resultados:
          type: array
          description: "MISMO orden y MISMA cantidad que las filas enviadas: se puede casar por índice."
          items:
            $ref: "#/components/schemas/HabilitacionRowResult"
    HabilitacionResumen:
      type: object
      description: "`total` = `habilitadas` + `habilitadasSinCambioDeEstado` + `conError`."
      required:
        - total
        - habilitadas
        - habilitadasSinCambioDeEstado
        - conError
      properties:
        total:
          type: integer
          description: Filas recibidas.
        habilitadas:
          type: integer
          description: "Volvieron a `en_reparto`."
        habilitadasSinCambioDeEstado:
          type: integer
          description: "Se registró la habilitación y el estado NO cambió."
        conError:
          type: integer
    HabilitacionRowResult:
      type: object
      required:
        - numGuia
        - resultado
        - estado
        - error
      properties:
        numGuia:
          description: "La guía tal como se envió (si la fila era inválida, puede no ser entero)."
        resultado:
          type: string
          enum:
            - habilitada
            - habilitada_sin_cambio_de_estado
            - error
          description: "`habilitada`: la orden volvió a `en_reparto`. `habilitada_sin_cambio_de_estado`: se registró y el estado NO cambió (SIEMPRE el caso de una `devuelta`). `error`: la fila no se procesó."
        estado:
          type:
            - string
            - "null"
          description: "Estado en el que la orden quedó; `null` cuando la fila falló."
        error:
          type:
            - object
            - "null"
          required:
            - codigo
            - mensaje
          properties:
            codigo:
              type: string
              enum:
                - fila_invalida
                - duplicada_en_lote
                - no_encontrada
                - estado_no_habilitable
              description: "`fila_invalida`: `num_guia`/`nota` no cumplen. `duplicada_en_lote`: la guía ya apareció antes en el mismo lote. `no_encontrada`: no hay orden viva con esa guía para esta key (no distingue «no existe» de «es de otro dueño»). `estado_no_habilitable`: el estado actual no es `ayuda_tienda` ni `devuelta` —incluye `reprogramada` y la segunda habilitación de una orden ya en `en_reparto`—."
            mensaje:
              type: string
  responses:
    Unauthorized:
      description: "API key ausente, mal formada o desconocida."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: UNAUTHORIZED
            message: No hay una sesion valida.
    Forbidden:
      description: El usuario dueño de la key no está activo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: FORBIDDEN
            message: No tienes permiso para realizar esta accion.
    NotFound:
      description: La orden no existe o pertenece a otro dueño (mismo 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: NOT_FOUND
            message: El recurso solicitado no existe.
    Conflict:
      description: El estado actual de la orden no permite la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: CONFLICT
            message: La operacion entra en conflicto con el estado actual.
    ValidationError:
      description: "Entrada inválida (query, path o cuerpo)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: VALIDATION_ERROR
            message: Los datos enviados no son validos.
            details:
              fieldErrors:
                limit:
                  - Number must be less than or equal to 100
