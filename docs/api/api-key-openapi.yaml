# Feature 106 — OpenAPI 3.1 del canal integrador por API key (Ordenex).
# GENERADO desde lib/api/openapi-spec.ts (fuente de verdad). No editar a mano:
# regenerar con `pnpm tsx <script>` si cambia el objeto TS.
openapi: 3.1.0
info:
  title: Ordenex — API de integración por API key
  version: 1.0.0
  description: |-
    Canal de integración por **API key** para crear, listar, consultar y cancelar órdenes.

    Autenticación: todos los endpoints exigen el header `Authorization: Bearer ordx_...`
    (API key con prefijo `ordx_`). La key identifica a un usuario dedicado que es el **dueño**
    de las órdenes: cada llamada opera SIEMPRE sobre las órdenes de ese dueño y sobre ninguna
    otra. El dueño de la key **solo ve y opera sus propias órdenes**; nunca se puede ampliar el
    alcance vía parámetros de la petición (un `tiendaId`/`owner` en la query se ignora).

    Aislamiento: una orden inexistente y una orden de otro dueño devuelven el **mismo 404**;
    la API no revela la existencia de recursos ajenos.

    Errores: shape uniforme del manejador global (feature 10) — ver el schema `Error`.
servers:
  - url: "http://localhost:3000"
    description: Desarrollo local
  - url: "https://{host}"
    description: "Producción (reemplazá {host} por el dominio real)"
    variables:
      host:
        default: app.ordenex.co
        description: Dominio del despliegue
security:
  - bearerAuth: []
tags:
  - name: Órdenes
    description: "Carga, listado, detalle y cancelación de órdenes propias."
paths:
  "/api/ordenes/api-key/carga":
    post:
      tags:
        - Órdenes
      summary: Carga de órdenes
      operationId: cargarOrdenes
      description: |-
        Crea una o más órdenes en firme. Cada orden nueva arranca en estado
        `por_recolectar_en_tienda` y recibe un `num_guia` en el acto. La respuesta incluye,
        por cada orden creada, su `costoEnvio` (flete + IVA de la tarifa vigente de la tienda;
        `"0.00"` si la tienda no tiene tarifa vigente).

        **CAMBIO INCOMPATIBLE (2026-07): el estado inicial cambió.** Antes las órdenes nacían
        en `en_ruta_bodega_central`, que afirmaba que el paquete ya viajaba hacia la bodega
        central sin que nadie lo hubiera recolectado. Ahora nacen en
        `por_recolectar_en_tienda`: el paquete espera en la tienda a que pase el mensajero, y
        pasa a `en_ruta_bodega_central` cuando este lo recolecta. Si tu integración compara el
        estado devuelto contra un literal, actualízala. El evento de webhook del nacimiento se
        conserva: `por_recolectar_en_tienda` es un evento público.

        Además, el estado interno de fulfillment en bodega fue retirado del catálogo: ya no
        aparece en el enum `estado` y no puede llegar en ninguna respuesta.

        Éxito parcial: las filas se clasifican en `creada`, `duplicada` (num_remision ya
        existente) o `error` (validación/geografía). Una respuesta 200 puede contener filas con
        error. El lote acepta entre 1 y 5000 filas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CargaRequest"
            examples:
              dosFilas:
                summary: "Dos filas (una válida, una con teléfono faltante)"
                value:
                  ordenes:
                    - num_remision: "REM-0001"
                      destinatario: Juan Pérez
                      telefono: "88887777"
                      provincia: San José
                      canton: San José
                      distrito: Carmen
                      direccion: "Av. Central, 200m norte del parque"
                      producto: Camiseta talla M
                      peso: "1.5"
                      monto_cobrar: "25.90"
                      notas: Entregar en la tarde
                    - num_remision: "REM-0002"
                      destinatario: María Solís
                      telefono: ""
                      provincia: San José
                      canton: Escazú
                      distrito: San Rafael
                      direccion: "Multiplaza, local 12"
                      producto: Zapatos talla 38
                      peso: "0.8"
                      monto_cobrar: "40.00"
                      notas: ""
      responses:
        "200":
          description: Lote procesado (puede incluir filas con error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaResponse"
              examples:
                resumen:
                  summary: "Una creada, una con error"
                  value:
                    cargaId: "9c2b7f10-5d3a-4e21-9a4b-77c8e0f1a2b3"
                    total: 2
                    creadas: 1
                    duplicadas: 0
                    conError: 1
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        resultado: creada
                        estatus: por_recolectar_en_tienda
                        numGuia: 100234
                      - fila: 2
                        numRemision: "REM-0002"
                        resultado: error
                        errores:
                          telefono:
                            - requerido
                    ordenes:
                      - id: "6f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
                        numRemision: "REM-0001"
                        numGuia: 100234
                        estado: por_recolectar_en_tienda
                        costoEnvio: "3.39"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key":
    get:
      tags:
        - Órdenes
      summary: Listado paginado de órdenes propias
      operationId: listarOrdenes
      description: |-
        Devuelve las órdenes del dueño de la key, paginadas por `offset`/`limit`, con `total`
        para recorrer páginas. El filtro opcional `estado` solo acota; nunca amplía el alcance.
        Parámetros desconocidos (p. ej. `tiendaId`) se ignoran.
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad de items por página (1..100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: "Cantidad de items a saltar (>= 0)."
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          required: false
          description: Filtra por estado exacto del catálogo.
          schema:
            type: string
            enum:
              - entregada
              - devuelta
              - devolviendo_a_tienda
              - reprogramada
              - por_recolectar_en_tienda
              - en_ruta_bodega_central
              - en_bodega_central
              - en_preparacion
              - por_recoger
              - en_ruta_bodega_satelite
              - en_reparto
              - rechazada
              - en_bodega_satelite
              - devuelta_a_tienda
              - ayuda_tienda
      responses:
        "200":
          description: Página de órdenes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listado"
              examples:
                pagina:
                  summary: Primera página con un item
                  value:
                    items:
                      - numGuia: 100234
                        numRemision: "REM-0001"
                        estado: en_ruta_bodega_central
                        destinatario: Juan Pérez
                        telefonoDest: "88887777"
                        producto: Camiseta talla M
                        direccion: "Av. Central, 200m norte del parque"
                        montoCobrar: 25.9
                        createdAt: "2026-07-22T14:03:11.000Z"
                    pagination:
                      limit: 50
                      offset: 0
                      total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/{numGuia}":
    parameters:
      - name: numGuia
        in: path
        required: true
        description: Número de guía de la orden (entero positivo).
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Órdenes
      summary: Detalle de una orden propia
      operationId: detalleOrden
      description: |-
        Detalle de UNA orden propia por `num_guia`, con sus evidencias de entrega/rechazo
        resueltas como URLs firmadas de corta duración (5 min). Array `evidencias` vacío si no
        hay. Una orden inexistente o de otro dueño devuelve el mismo 404.
      responses:
        "200":
          description: Detalle de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenDetalle"
              examples:
                detalle:
                  summary: Orden entregada con una evidencia
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: entregada
                    destinatario: Juan Pérez
                    telefonoDest: "88887777"
                    producto: Camiseta talla M
                    direccion: "Av. Central, 200m norte del parque"
                    montoCobrar: 25.9
                    createdAt: "2026-07-22T14:03:11.000Z"
                    evidencias:
                      - resultado: entregada
                        contentType: image/jpeg
                        url: "https://<proyecto>.supabase.co/storage/v1/object/sign/gestion-evidencias/..."
                        expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/{numGuia}/cancelar":
    parameters:
      - name: numGuia
        in: path
        required: true
        description: Número de guía de la orden a cancelar (entero positivo).
        schema:
          type: integer
          minimum: 1
    put:
      tags:
        - Órdenes
      summary: Cancelar una orden propia
      operationId: cancelarOrden
      description: |-
        Cancela una orden propia. Solo procede si el estado actual es `en_bodega_central` o
        `en_ruta_bodega_central`; en ese caso transiciona a `devolviendo_a_tienda`. Cualquier otro
        estado devuelve 409. Sin cuerpo. Una orden inexistente o de otro dueño devuelve 404.
      responses:
        "200":
          description: Orden cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelacionResponse"
              examples:
                cancelada:
                  summary: Cancelación desde en_ruta_bodega_central
                  value:
                    numGuia: 100234
                    estadoAnterior: en_ruta_bodega_central
                    estado: devolviendo_a_tienda
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision`. Si el valor casa con la guía de una orden y con la remisión de otra, gana la de la guía."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags:
        - Órdenes
      summary: Detalle de una orden propia por guía o remisión
      operationId: detalleOrdenPorIdentificador
      description: |-
        Mismo detalle que `GET /api/ordenes/api-key/{numGuia}` (idéntico schema `OrdenDetalle`),
        pero aceptando como identificador el `num_guia` **o** el `num_remision` de la orden.
        Resolución: si el identificador es un entero positivo se busca primero por `num_guia`;
        si no hay coincidencia, se busca por `num_remision`. Nunca responde 409 por ambigüedad.

        Una orden inexistente, borrada o de otro dueño devuelve el mismo 404.
      responses:
        "200":
          description: Detalle de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenDetalle"
              examples:
                detalle:
                  summary: Orden resuelta por su número de remisión
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: entregada
                    destinatario: Juan Pérez
                    telefonoDest: "88887777"
                    producto: Camiseta talla M
                    direccion: "Av. Central, 200m norte del parque"
                    montoCobrar: 25.9
                    createdAt: "2026-07-22T14:03:11.000Z"
                    evidencias:
                      - resultado: entregada
                        contentType: image/jpeg
                        url: "https://<proyecto>.supabase.co/storage/v1/object/sign/gestion-evidencias/..."
                        expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}/generate":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision` (misma resolución que el endpoint de detalle)."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      tags:
        - Órdenes
      summary: PDF de etiqueta de una orden propia
      operationId: generarPdfOrden
      description: |-
        Devuelve una URL firmada de corta duración con el PDF de la etiqueta de la orden.
        La primera llamada construye el PDF y lo almacena (`generado: true`); las siguientes
        reutilizan el mismo documento y solo lo vuelven a firmar (`generado: false`), por lo
        que la `url` cambia en cada llamada aunque el PDF sea el mismo.

        Solo responde a `POST`. Una orden sin guía imprimible devuelve 409.
      responses:
        "200":
          description: URL firmada del PDF de la etiqueta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                primeraLlamada:
                  summary: "Primera llamada: el PDF se construye"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: true
                reuso:
                  summary: "Llamada posterior: solo se vuelve a firmar"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/carga/{cargaId}/generate":
    parameters:
      - name: cargaId
        in: path
        required: true
        description: "Id del lote, tal como lo devuelve `cargaId` en la respuesta de `POST /api/ordenes/api-key/carga`."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Órdenes
      summary: PDF consolidado de etiquetas de un lote propio
      operationId: generarPdfCarga
      description: |-
        Misma forma de respuesta que el PDF por orden, sobre el consolidado de todas las
        etiquetas imprimibles del lote (solo órdenes propias y vivas). La primera llamada lo
        construye (`generado: true`); las siguientes solo vuelven a firmar (`generado: false`).

        Solo responde a `POST`. Un lote inexistente o de otro dueño devuelve el mismo 404; un
        lote sin etiquetas imprimibles, o que excede el tope de etiquetas por PDF, devuelve 409.
      responses:
        "200":
          description: URL firmada del PDF consolidado del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                consolidado:
                  summary: Consolidado del lote recién construido
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  # Feature 255 (R47) — OCTAVO endpoint del canal: cotización previa, lectura pura.
  "/api/ordenes/api-key/cotizacion":
    post:
      tags:
        - Órdenes
      summary: "Cotización de un lote (no crea nada)"
      operationId: cotizarOrdenes
      description: |-
        Cotiza un lote de filas **sin crear nada**: por cada fila devuelve si hay cobertura y
        cuánto costaría la orden en los DOS escenarios posibles (entregada y devuelta), más un
        bloque `totales` con la suma del lote.

        **Acepta el MISMO cuerpo que `POST /api/ordenes/api-key/carga`, sin recortarlo.** Las
        filas son pares clave/valor de TEXTO, con la geografía en columnas SEPARADAS
        (`provincia`, `canton`, `distrito`, `direccion`) y `monto_cobrar` como texto. Las claves
        que la cotización no usa se ignoran en silencio. `num_remision` es OPCIONAL aquí y solo
        sirve para correlacionar la respuesta con tu fila: si no viene, la fila responde
        `numRemision: null`. No hay deduplicación de ninguna clase, ni contra el lote ni contra
        las órdenes existentes. El lote acepta entre 1 y 5000 filas: el mismo tope
        que la carga.

        **Lectura pura.** Este endpoint NO crea órdenes, NO consume ningún número de guía y NO
        persiste nada: ni orden, ni lote de carga, ni historial, ni movimiento de wallet, ni
        notificación, ni registro de auditoría. Llamarlo dos veces con el mismo cuerpo no cambia
        ningún estado.

        **Supuesto declarado: `cobra_comision = true`.** La cotización asume que la orden que se
        crearía cobra comisión COD (el mismo default de la columna `orden.cobra_comision`), así
        que el escenario entregado incluye siempre `comision` e `ivaComision`. Una orden que
        acabara creándose sin comisión costaría menos que lo cotizado aquí.

        **Los importes se emiten SOLO formateados.** Cada importe viene en una única forma:
        símbolo de moneda, parte entera agrupada con separador de miles, separador decimal y
        exactamente DOS decimales, con el signo negativo DELANTE del símbolo (`-₡1.578,00`). NO
        hay un campo crudo de escala 2 en paralelo: el string formateado ES el contrato. Si tu
        integración necesita operar con el número, parsealo en tu lado.

        **`totales` es una SUMA de las filas cotizadas, NO el precio del lote.** El precio
        depende de la zona de CADA fila, así que el bloque suma únicamente las filas con
        resultado `cotizada` y por eso declara sus dos contadores propios, `filasSumadas` y
        `filasExcluidas`, cuya suma es igual a `total`. Un total que callara las filas que dejó
        fuera se leería como «esto cuesta el lote» cuando no lo es. El bloque se emite SIEMPRE:
        si ninguna fila resulta cotizable, llega con todos sus importes en cero,
        `filasSumadas: 0` y `filasExcluidas` igual a `total`.

        Éxito parcial: una fila sin cobertura (o que no valida) se marca `resultado: "error"`
        con sus mensajes por campo y NO trae `costos`; las demás se cotizan igual y la respuesta
        sigue siendo 200. No existe el resultado `duplicada`: sin persistencia no significa nada.

        Si la tienda dueña de la key no tiene una tarifa vigente, la respuesta es **409** y no se
        cotiza ninguna fila. Es la asimetría deliberada con `/carga`, que sí tolera la falta de
        tarifa con `costoEnvio: "0.00"`: en una cotización, un cero sería una mentira sobre
        dinero servida como precio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizacionRequest"
            examples:
              dosFilas:
                summary: "Dos filas (una con cobertura, una con distrito inexistente)"
                value:
                  ordenes:
                    - provincia: San José
                      canton: Escazú
                      distrito: San Rafael
                      direccion: "Multiplaza, local 12"
                      monto_cobrar: "25900"
                      num_remision: "REM-0001"
                    - provincia: San José
                      canton: Escazú
                      distrito: Distrito que no existe
                      direccion: Sin referencia
                      monto_cobrar: "18000"
      responses:
        "200":
          description: Lote cotizado (puede incluir filas con error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CotizacionResponse"
              examples:
                resumen:
                  summary: "Una cotizada (con sus dos escenarios) y una con error"
                  value:
                    total: 2
                    cotizadas: 1
                    conError: 1
                    totales:
                      filasSumadas: 1
                      filasExcluidas: 1
                      entregado:
                        flete: "₡2.500,00"
                        iva: "₡325,00"
                        comision: "₡906,50"
                        ivaComision: "₡117,85"
                        total: "₡22.050,65"
                      devuelto:
                        flete: "₡1.396,46"
                        iva: "₡181,54"
                        comision: "₡0,00"
                        total: "-₡1.578,00"
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        resultado: cotizada
                        costos:
                          entregado:
                            flete: "₡2.500,00"
                            iva: "₡325,00"
                            comision: "₡906,50"
                            ivaComision: "₡117,85"
                            total: "₡22.050,65"
                          devuelto:
                            flete: "₡1.396,46"
                            iva: "₡181,54"
                            comision: "₡0,00"
                            total: "-₡1.578,00"
                      - fila: 2
                        numRemision: null
                        resultado: error
                        errores:
                          distrito:
                            - distrito no encontrado en el canton
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "La tienda dueña de la key no tiene una tarifa vigente: no se cotiza ninguna fila."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: CONFLICT
                message: "la tienda no tiene una tarifa vigente asociada: no se puede cotizar"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key con prefijo `ordx_` en el header `Authorization: Bearer ordx_...`."
  schemas:
    Error:
      type: object
      description: "Shape uniforme de error del manejador global (feature 10). `status` siempre `\"error\"`."
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL
          description: Código estable (independiente del status HTTP).
        message:
          type: string
          description: Mensaje fijo en español.
        details:
          type: object
          description: "Detalle opcional. En 422 lleva `fieldErrors` (campo -> lista de errores)."
          additionalProperties: true
    OrdenListItem:
      type: object
      description: Item público de una orden propia (sin ids internos ni PII de terceros).
      required:
        - numGuia
        - numRemision
        - estado
        - destinatario
        - telefonoDest
        - producto
        - direccion
        - montoCobrar
        - createdAt
      properties:
        numGuia:
          type:
            - integer
            - "null"
          description: Número de guía (null si aún no asignado).
        numRemision:
          type: string
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
        destinatario:
          type: string
        telefonoDest:
          type: string
        producto:
          type: string
        direccion:
          type:
            - string
            - "null"
        montoCobrar:
          type:
            - number
            - "null"
          description: Monto a cobrar (COD).
        createdAt:
          type: string
          format: "date-time"
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Total de órdenes que cumplen el filtro.
    Listado:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrdenListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Evidencia:
      type: object
      description: Evidencia de entrega/rechazo con URL firmada de corta duración.
      required:
        - resultado
        - contentType
        - url
        - expiraEnSegundos
      properties:
        resultado:
          type: string
          enum:
            - entregada
            - rechazada
        contentType:
          type:
            - string
            - "null"
          description: MIME del archivo (p. ej. image/jpeg).
        url:
          type: string
          format: uri
          description: URL firmada (vence a los 5 min).
        expiraEnSegundos:
          type: integer
          description: TTL de la URL firmada en segundos (300).
    OrdenDetalle:
      allOf:
        - $ref: "#/components/schemas/OrdenListItem"
        - type: object
          required:
            - evidencias
          properties:
            evidencias:
              type: array
              description: "Evidencias de la orden ([] si no hay)."
              items:
                $ref: "#/components/schemas/Evidencia"
    CargaRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 5000
          description: Filas a cargar (1..5000). Todos los valores son texto.
          items:
            $ref: "#/components/schemas/CargaRow"
    CargaRow:
      type: object
      description: "Una fila de carga. Todas las claves son strings. Las requeridas se validan en el servidor; una fila inválida no aborta el lote (se reporta como `error`)."
      required:
        - num_remision
        - destinatario
        - telefono
        - provincia
        - canton
        - distrito
        - direccion
        - producto
        - peso
        - monto_cobrar
      properties:
        num_remision:
          type: string
          description: Identificador de remisión (dedup por este valor).
        destinatario:
          type: string
        telefono:
          type: string
        provincia:
          type: string
        canton:
          type: string
        distrito:
          type: string
        direccion:
          type: string
        producto:
          type: string
        peso:
          type: string
          description: "Peso en kg como texto (p. ej. \"1.5\")."
        monto_cobrar:
          type: string
          description: "Monto COD como texto (p. ej. \"25.90\")."
        notas:
          type: string
      additionalProperties:
        type: string
    CargaRowResult:
      type: object
      description: Resultado por fila del lote.
      required:
        - fila
        - numRemision
        - resultado
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type: string
        resultado:
          type: string
          enum:
            - creada
            - duplicada
            - error
        estatus:
          type: string
          description: Estado (en creada/duplicada); nunca ids internos.
        numGuia:
          type: integer
          description: "Número de guía asignado (solo en `creada`)."
        errores:
          type: object
          description: "Errores por campo (solo en `error`)."
          additionalProperties:
            type: array
            items:
              type: string
    CargaOrden:
      type: object
      description: Una orden efectivamente creada (bloque plano listo para consumir).
      required:
        - id
        - numRemision
        - numGuia
        - estado
        - costoEnvio
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de la orden creada.
        numRemision:
          type: string
        numGuia:
          type: integer
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
        costoEnvio:
          type: string
          description: "Costo del envío (flete + IVA), string escala 2. \"0.00\" si la tienda no tiene tarifa vigente. Distinto de `monto_cobrar`/COD."
    CargaResponse:
      type: object
      required:
        - total
        - creadas
        - duplicadas
        - conError
        - filas
        - ordenes
      properties:
        cargaId:
          type:
            - string
            - "null"
          format: uuid
          description: "Id del lote creado, para pedir después el PDF consolidado. `null` si el lote no creó ninguna orden."
        total:
          type: integer
          description: Filas recibidas.
        creadas:
          type: integer
        duplicadas:
          type: integer
        conError:
          type: integer
        filas:
          type: array
          items:
            $ref: "#/components/schemas/CargaRowResult"
        ordenes:
          type: array
          items:
            $ref: "#/components/schemas/CargaOrden"
    CancelacionResponse:
      type: object
      required:
        - numGuia
        - estadoAnterior
        - estado
      properties:
        numGuia:
          type: integer
        estadoAnterior:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
            - ayuda_tienda
        estado:
          type: string
          const: devolviendo_a_tienda
    PdfGenerateResponse:
      type: object
      description: "URL firmada de corta duración con el PDF de etiqueta (de una orden o de un lote). La URL se firma en cada llamada: nunca es una URL persistida."
      required:
        - url
        - expiraEnSegundos
        - generado
      properties:
        url:
          type: string
          format: uri
          description: URL firmada del PDF.
        expiraEnSegundos:
          type: integer
          description: "TTL de la URL firmada en segundos (300 por defecto)."
        generado:
          type: boolean
          description: "`true` si el PDF se construyó en esta llamada; `false` si se reutilizó el ya almacenado y solo se volvió a firmar."
    # Feature 255 — cotización previa (lectura pura). Todos los importes son STRINGS ya
    # formateados (símbolo + miles + exactamente 2 decimales, signo delante del símbolo):
    # NO existe un campo crudo de escala 2 en paralelo.
    CotizacionRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 5000
          description: "Filas a cotizar (1..5000, el mismo tope que la carga). Todos los valores son texto."
          items:
            $ref: "#/components/schemas/CotizacionRow"
    CotizacionRow:
      type: object
      description: |-
        Una fila a cotizar. Es la MISMA fila cruda que acepta `POST /api/ordenes/api-key/carga`:
        podés mandar el cuerpo de la carga sin recortarlo y las claves que la cotización no usa
        se ignoran. `num_remision` es opcional y solo correlaciona.

        NINGUNA clave de la fila está en `required`, y es deliberado: el servidor NO rechaza el
        lote por una fila incompleta. La terna geográfica (`provincia`, `canton`, `distrito`) es
        NECESARIA para poder cotizar la fila, pero su ausencia NO es un 422 del lote: esa fila
        vuelve con `resultado: "error"` y el detalle bajo la clave del campo que falta, y las
        demás filas se cotizan igual (éxito parcial). Declararla `required` haría que un cliente
        generado con validación estricta rechazara EN LOCAL un cuerpo que el servidor acepta y
        responde 200.

        Cuándo recibís 422: solo por el lote entero — `ordenes` vacío o por encima del tope
        (o un valor que no sea texto). Cuándo recibís 200 con filas en `error`: por cualquier
        problema de una fila concreta — terna ausente o vacía, distrito no encontrado, distrito
        ambiguo, distrito sin zona asignada, o `monto_cobrar` con formato inválido.
      properties:
        provincia:
          type: string
          description: "Necesaria para cotizar la fila. Si falta, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        canton:
          type: string
          description: "Necesario para cotizar la fila. Si falta, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        distrito:
          type: string
          description: "Su zona decide la columna de flete. Necesario para cotizar la fila: si falta, no se encuentra, es ambiguo o no tiene zona, la fila sale con `resultado: \"error\"` (no un 422 del lote)."
        direccion:
          type: string
          description: Se acepta; no participa del precio.
        monto_cobrar:
          type: string
          description: "Monto COD como texto (p. ej. \"25900\"). Base de la comisión; vacío o ausente se trata como cero."
        num_remision:
          type: string
          description: "OPCIONAL: solo correlación. No se deduplica ni contra el lote ni contra las órdenes existentes."
      additionalProperties:
        type: string
    CotizacionEscenarioEntregado:
      type: object
      description: "Costo si la orden se ENTREGA: cinco conceptos. `total` es lo que RECIBE la tienda = monto a cobrar − (flete + iva + comision + ivaComision), y es negativo si no hay COD que cubra lo facturado."
      required:
        - flete
        - iva
        - comision
        - ivaComision
        - total
      properties:
        flete:
          type: string
          description: Flete de la zona del distrito, formateado.
        iva:
          type: string
          description: IVA del flete, formateado.
        comision:
          type: string
          description: Comisión COD, formateada.
        ivaComision:
          type: string
          description: IVA de la comisión, formateado.
        total:
          type: string
          description: Lo que recibe la tienda, formateado.
    CotizacionEscenarioDevuelto:
      type: object
      description: "Costo si la orden se DEVUELVE: cuatro conceptos, SIN `ivaComision` (no hay comisión que gravar). `comision` es un cero EXPLÍCITO — la afirmación de que una devolución no cobra comisión COD, no un dato ausente. `total` es la DEUDA de la tienda = −(flete + iva), y por eso es negativo."
      required:
        - flete
        - iva
        - comision
        - total
      properties:
        flete:
          type: string
          description: Flete de devolución, formateado.
        iva:
          type: string
          description: IVA del flete de devolución, formateado.
        comision:
          type: string
          description: "Siempre cero formateado: una devolución no cobra comisión COD."
        total:
          type: string
          description: "Deuda de la tienda, formateada (negativa)."
    CotizacionCostos:
      type: object
      description: "Los DOS escenarios de una fila con cobertura. Ausente en una fila `error`."
      required:
        - entregado
        - devuelto
      properties:
        entregado:
          $ref: "#/components/schemas/CotizacionEscenarioEntregado"
        devuelto:
          $ref: "#/components/schemas/CotizacionEscenarioDevuelto"
    CotizacionRowResult:
      type: object
      description: "Resultado por fila. No existe `duplicada`: sin persistencia no significa nada."
      required:
        - fila
        - numRemision
        - resultado
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type:
            - string
            - "null"
          description: "El `num_remision` que mandaste, tal cual; `null` si la fila no lo trajo."
        resultado:
          type: string
          enum:
            - cotizada
            - error
        costos:
          $ref: "#/components/schemas/CotizacionCostos"
        errores:
          type: object
          description: "Errores por campo (solo en `error`)."
          additionalProperties:
            type: array
            items:
              type: string
    CotizacionTotales:
      type: object
      description: "SUMA de las filas cotizadas, NO el precio del lote: el precio depende de la zona de cada fila. Suma únicamente las filas con resultado `cotizada` y declara cuántas sumó y cuántas dejó fuera (`filasSumadas + filasExcluidas === total`). Se emite SIEMPRE, en cero si ninguna fila resultó cotizable."
      required:
        - filasSumadas
        - filasExcluidas
        - entregado
        - devuelto
      properties:
        filasSumadas:
          type: integer
          description: "Filas que aportaron a estos importes (las `cotizada`)."
        filasExcluidas:
          type: integer
          description: "Filas que NO aportaron nada (las `error`). El total no las cuenta."
        entregado:
          $ref: "#/components/schemas/CotizacionEscenarioEntregado"
        devuelto:
          $ref: "#/components/schemas/CotizacionEscenarioDevuelto"
    CotizacionResponse:
      type: object
      required:
        - total
        - cotizadas
        - conError
        - totales
        - filas
      properties:
        total:
          type: integer
          description: Filas recibidas.
        cotizadas:
          type: integer
        conError:
          type: integer
        totales:
          $ref: "#/components/schemas/CotizacionTotales"
        filas:
          type: array
          items:
            $ref: "#/components/schemas/CotizacionRowResult"
  responses:
    Unauthorized:
      description: "API key ausente, mal formada o desconocida."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: UNAUTHORIZED
            message: No hay una sesion valida.
    Forbidden:
      description: El usuario dueño de la key no está activo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: FORBIDDEN
            message: No tienes permiso para realizar esta accion.
    NotFound:
      description: La orden no existe o pertenece a otro dueño (mismo 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: NOT_FOUND
            message: El recurso solicitado no existe.
    Conflict:
      description: El estado actual de la orden no permite la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: CONFLICT
            message: La operacion entra en conflicto con el estado actual.
    ValidationError:
      description: "Entrada inválida (query, path o cuerpo)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: VALIDATION_ERROR
            message: Los datos enviados no son validos.
            details:
              fieldErrors:
                limit:
                  - Number must be less than or equal to 100
