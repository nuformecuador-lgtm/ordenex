# Feature 106 — OpenAPI 3.1 del canal integrador por API key (Ordenex).
# GENERADO desde lib/api/openapi-spec.ts (fuente de verdad). No editar a mano:
# regenerar con `pnpm tsx <script>` si cambia el objeto TS.
openapi: 3.1.0
info:
  title: Ordenex — API de integración por API key
  version: 1.0.0
  description: |-
    Canal de integración por **API key** para crear, listar, consultar y cancelar órdenes.

    Autenticación: todos los endpoints exigen el header `Authorization: Bearer ordx_...`
    (API key con prefijo `ordx_`). La key identifica a un usuario dedicado que es el **dueño**
    de las órdenes: cada llamada opera SIEMPRE sobre las órdenes de ese dueño y sobre ninguna
    otra. El dueño de la key **solo ve y opera sus propias órdenes**; nunca se puede ampliar el
    alcance vía parámetros de la petición (un `tiendaId`/`owner` en la query se ignora).

    Aislamiento: una orden inexistente y una orden de otro dueño devuelven el **mismo 404**;
    la API no revela la existencia de recursos ajenos.

    Errores: shape uniforme del manejador global (feature 10) — ver el schema `Error`.
servers:
  - url: "http://localhost:3000"
    description: Desarrollo local
  - url: "https://{host}"
    description: "Producción (reemplazá {host} por el dominio real)"
    variables:
      host:
        default: app.ordenex.co
        description: Dominio del despliegue
security:
  - bearerAuth: []
tags:
  - name: Órdenes
    description: "Carga, listado, detalle y cancelación de órdenes propias."
paths:
  "/api/ordenes/api-key/carga":
    post:
      tags:
        - Órdenes
      summary: Carga de órdenes
      operationId: cargarOrdenes
      description: |-
        Crea una o más órdenes en firme. Cada orden nueva arranca en estado
        `por_recolectar_en_tienda` y recibe un `num_guia` en el acto. La respuesta incluye,
        por cada orden creada, su `costoEnvio` (flete + IVA de la tarifa vigente de la tienda;
        `"0.00"` si la tienda no tiene tarifa vigente).

        **CAMBIO INCOMPATIBLE (2026-07): el estado inicial cambió.** Antes las órdenes nacían
        en `en_ruta_bodega_central`, que afirmaba que el paquete ya viajaba hacia la bodega
        central sin que nadie lo hubiera recolectado. Ahora nacen en
        `por_recolectar_en_tienda`: el paquete espera en la tienda a que pase el mensajero, y
        pasa a `en_ruta_bodega_central` cuando este lo recolecta. Si tu integración compara el
        estado devuelto contra un literal, actualízala. El evento de webhook del nacimiento se
        conserva: `por_recolectar_en_tienda` es un evento público.

        Además, el estado interno de fulfillment en bodega fue retirado del catálogo: ya no
        aparece en el enum `estado` y no puede llegar en ninguna respuesta.

        Éxito parcial: las filas se clasifican en `creada`, `duplicada` (num_remision ya
        existente) o `error` (validación/geografía). Una respuesta 200 puede contener filas con
        error. El lote acepta entre 1 y 5000 filas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CargaRequest"
            examples:
              dosFilas:
                summary: "Dos filas (una válida, una con teléfono faltante)"
                value:
                  ordenes:
                    - num_remision: "REM-0001"
                      destinatario: Juan Pérez
                      telefono: "88887777"
                      provincia: San José
                      canton: San José
                      distrito: Carmen
                      direccion: "Av. Central, 200m norte del parque"
                      producto: Camiseta talla M
                      peso: "1.5"
                      monto_cobrar: "25.90"
                      notas: Entregar en la tarde
                    - num_remision: "REM-0002"
                      destinatario: María Solís
                      telefono: ""
                      provincia: San José
                      canton: Escazú
                      distrito: San Rafael
                      direccion: "Multiplaza, local 12"
                      producto: Zapatos talla 38
                      peso: "0.8"
                      monto_cobrar: "40.00"
                      notas: ""
      responses:
        "200":
          description: Lote procesado (puede incluir filas con error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaResponse"
              examples:
                resumen:
                  summary: "Una creada, una con error"
                  value:
                    cargaId: "9c2b7f10-5d3a-4e21-9a4b-77c8e0f1a2b3"
                    total: 2
                    creadas: 1
                    duplicadas: 0
                    conError: 1
                    filas:
                      - fila: 1
                        numRemision: "REM-0001"
                        resultado: creada
                        estatus: por_recolectar_en_tienda
                        numGuia: 100234
                      - fila: 2
                        numRemision: "REM-0002"
                        resultado: error
                        errores:
                          telefono:
                            - requerido
                    ordenes:
                      - id: "6f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
                        numRemision: "REM-0001"
                        numGuia: 100234
                        estado: por_recolectar_en_tienda
                        costoEnvio: "3.39"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key":
    get:
      tags:
        - Órdenes
      summary: Listado paginado de órdenes propias
      operationId: listarOrdenes
      description: |-
        Devuelve las órdenes del dueño de la key, paginadas por `offset`/`limit`, con `total`
        para recorrer páginas. El filtro opcional `estado` solo acota; nunca amplía el alcance.
        Parámetros desconocidos (p. ej. `tiendaId`) se ignoran.
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad de items por página (1..100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: "Cantidad de items a saltar (>= 0)."
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          required: false
          description: Filtra por estado exacto del catálogo.
          schema:
            type: string
            enum:
              - entregada
              - devuelta
              - devolviendo_a_tienda
              - reprogramada
              - por_recolectar_en_tienda
              - en_ruta_bodega_central
              - en_bodega_central
              - en_preparacion
              - por_recoger
              - en_ruta_bodega_satelite
              - en_reparto
              - rechazada
              - en_bodega_satelite
              - devuelta_a_tienda
      responses:
        "200":
          description: Página de órdenes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listado"
              examples:
                pagina:
                  summary: Primera página con un item
                  value:
                    items:
                      - numGuia: 100234
                        numRemision: "REM-0001"
                        estado: en_ruta_bodega_central
                        destinatario: Juan Pérez
                        telefonoDest: "88887777"
                        producto: Camiseta talla M
                        direccion: "Av. Central, 200m norte del parque"
                        montoCobrar: 25.9
                        createdAt: "2026-07-22T14:03:11.000Z"
                    pagination:
                      limit: 50
                      offset: 0
                      total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/{numGuia}":
    parameters:
      - name: numGuia
        in: path
        required: true
        description: Número de guía de la orden (entero positivo).
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Órdenes
      summary: Detalle de una orden propia
      operationId: detalleOrden
      description: |-
        Detalle de UNA orden propia por `num_guia`, con sus evidencias de entrega/rechazo
        resueltas como URLs firmadas de corta duración (5 min). Array `evidencias` vacío si no
        hay. Una orden inexistente o de otro dueño devuelve el mismo 404.
      responses:
        "200":
          description: Detalle de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenDetalle"
              examples:
                detalle:
                  summary: Orden entregada con una evidencia
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: entregada
                    destinatario: Juan Pérez
                    telefonoDest: "88887777"
                    producto: Camiseta talla M
                    direccion: "Av. Central, 200m norte del parque"
                    montoCobrar: 25.9
                    createdAt: "2026-07-22T14:03:11.000Z"
                    evidencias:
                      - resultado: entregada
                        contentType: image/jpeg
                        url: "https://<proyecto>.supabase.co/storage/v1/object/sign/gestion-evidencias/..."
                        expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/{numGuia}/cancelar":
    parameters:
      - name: numGuia
        in: path
        required: true
        description: Número de guía de la orden a cancelar (entero positivo).
        schema:
          type: integer
          minimum: 1
    put:
      tags:
        - Órdenes
      summary: Cancelar una orden propia
      operationId: cancelarOrden
      description: |-
        Cancela una orden propia. Solo procede si el estado actual es `en_bodega_central` o
        `en_ruta_bodega_central`; en ese caso transiciona a `devolviendo_a_tienda`. Cualquier otro
        estado devuelve 409. Sin cuerpo. Una orden inexistente o de otro dueño devuelve 404.
      responses:
        "200":
          description: Orden cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelacionResponse"
              examples:
                cancelada:
                  summary: Cancelación desde en_ruta_bodega_central
                  value:
                    numGuia: 100234
                    estadoAnterior: en_ruta_bodega_central
                    estado: devolviendo_a_tienda
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision`. Si el valor casa con la guía de una orden y con la remisión de otra, gana la de la guía."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags:
        - Órdenes
      summary: Detalle de una orden propia por guía o remisión
      operationId: detalleOrdenPorIdentificador
      description: |-
        Mismo detalle que `GET /api/ordenes/api-key/{numGuia}` (idéntico schema `OrdenDetalle`),
        pero aceptando como identificador el `num_guia` **o** el `num_remision` de la orden.
        Resolución: si el identificador es un entero positivo se busca primero por `num_guia`;
        si no hay coincidencia, se busca por `num_remision`. Nunca responde 409 por ambigüedad.

        Una orden inexistente, borrada o de otro dueño devuelve el mismo 404.
      responses:
        "200":
          description: Detalle de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenDetalle"
              examples:
                detalle:
                  summary: Orden resuelta por su número de remisión
                  value:
                    numGuia: 100234
                    numRemision: "REM-0001"
                    estado: entregada
                    destinatario: Juan Pérez
                    telefonoDest: "88887777"
                    producto: Camiseta talla M
                    direccion: "Av. Central, 200m norte del parque"
                    montoCobrar: 25.9
                    createdAt: "2026-07-22T14:03:11.000Z"
                    evidencias:
                      - resultado: entregada
                        contentType: image/jpeg
                        url: "https://<proyecto>.supabase.co/storage/v1/object/sign/gestion-evidencias/..."
                        expiraEnSegundos: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/orden/{id}/generate":
    parameters:
      - name: id
        in: path
        required: true
        description: "Identificador de la orden: su `num_guia` o su `num_remision` (misma resolución que el endpoint de detalle)."
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      tags:
        - Órdenes
      summary: PDF de etiqueta de una orden propia
      operationId: generarPdfOrden
      description: |-
        Devuelve una URL firmada de corta duración con el PDF de la etiqueta de la orden.
        La primera llamada construye el PDF y lo almacena (`generado: true`); las siguientes
        reutilizan el mismo documento y solo lo vuelven a firmar (`generado: false`), por lo
        que la `url` cambia en cada llamada aunque el PDF sea el mismo.

        Solo responde a `POST`. Una orden sin guía imprimible devuelve 409.
      responses:
        "200":
          description: URL firmada del PDF de la etiqueta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                primeraLlamada:
                  summary: "Primera llamada: el PDF se construye"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: true
                reuso:
                  summary: "Llamada posterior: solo se vuelve a firmar"
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/carga/{cargaId}/generate":
    parameters:
      - name: cargaId
        in: path
        required: true
        description: "Id del lote, tal como lo devuelve `cargaId` en la respuesta de `POST /api/ordenes/api-key/carga`."
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Órdenes
      summary: PDF consolidado de etiquetas de un lote propio
      operationId: generarPdfCarga
      description: |-
        Misma forma de respuesta que el PDF por orden, sobre el consolidado de todas las
        etiquetas imprimibles del lote (solo órdenes propias y vivas). La primera llamada lo
        construye (`generado: true`); las siguientes solo vuelven a firmar (`generado: false`).

        Solo responde a `POST`. Un lote inexistente o de otro dueño devuelve el mismo 404; un
        lote sin etiquetas imprimibles, o que excede el tope de etiquetas por PDF, devuelve 409.
      responses:
        "200":
          description: URL firmada del PDF consolidado del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfGenerateResponse"
              examples:
                consolidado:
                  summary: Consolidado del lote recién construido
                  value:
                    url: "https://<proyecto>.supabase.co/storage/v1/object/sign/etiquetas/..."
                    expiraEnSegundos: 300
                    generado: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/api/ordenes/api-key/cotizar":
    post:
      tags:
        - Órdenes
      summary: Cotizar el envío a un distrito
      operationId: cotizarEnvio
      description: |-
        Cotiza el envío a un distrito para la tienda dueña de la key. **Solo lee**: no crea
        órdenes, no reserva nada y no deja rastro. La tienda sale de la key: no hay ninguna
        clave de tienda en el cuerpo (una clave así se ignora).

        La respuesta trae los **dos escenarios a la vez** —`entregada` y `devuelta`—, y cada uno
        con su desglose `unitario` y su `total` por las N órdenes. El `total` es el valor
        unitario **ya redondeado** multiplicado por N, no el redondeo final de una multiplicación
        sin redondear: así es como el cierre acumula los importes orden por orden.

        **Todo importe es una CADENA de escala 2** (p. ej. `"2200.00"`, `"-1695.00"`), nunca un
        número JSON: el dinero no viaja en punto flotante.

        **⚠ El `netoTienda` del escenario DEVUELTA es NEGATIVO y NO EXISTE EN EL CIERRE.** Es un
        número **del cotizador** —«cuánto te cuesta si vuelve»—, no un asiento, y **no debe
        cuadrarse contra ninguna línea de cierre**. La razón es del cálculo del cierre: el pago a
        la tienda **no descuenta el flete de devolución**, porque una devolución no recauda COD y
        por tanto no aporta al total general. Si intentás cuadrar este neto contra un cierre, la
        diferencia que te salga no es un error del cierre.

        **Supuesto de la cotización múltiple (`cantidad` > 1):** las N órdenes comparten
        **distrito y monto a cobrar**, y la respuesta lo declara en el campo `supuesto`. Una
        canasta heterogénea NO se cotiza multiplicando: la comisión COD es un porcentaje del
        monto, así que N montos distintos no son una multiplicación. Para montos distintos,
        cotizá una vez por monto.

        **Tarifa aplicada:** la **vigente al momento de cotizar** (el cierre congela la suya
        aparte, así que una cotización guardada no es una promesa de precio).

        **Deuda heredada, declarada:** la tarifa cotizada es la más reciente **no borrada** de la
        tienda; el resolver **no filtra por `tarifas.status`**, así que **una tarifa marcada
        `inactivo` que no haya sido borrada puede cotizarse**. Es exactamente la misma tarifa que
        aplicaría el cierre hoy: el cotizador **hereda** esa deuda, no la introduce, y su arreglo
        es una ficha aparte.

        **`fulfillment` no se cotiza.** Ninguna fórmula del cierre lo usa hoy, así que no aparece
        en ninguna respuesta ni en ningún schema de este contrato. Cotizarlo prometería un cobro
        que el cierre no aplica.

        Si el distrito no resuelve **exactamente una** zona (ninguna, o varias), la respuesta es
        200 con el bloque `cobertura` y `costos: null`: no se elige una zona arbitraria y no se
        lee ninguna tarifa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizacionRequest"
            examples:
              tresOrdenes:
                summary: "Tres órdenes al mismo distrito, con comisión COD"
                value:
                  provincia: San José
                  canton: Central
                  distrito: Carmen
                  monto_cobrar: "25000.00"
                  cantidad: 3
                  cobra_comision: true
              unaSinComision:
                summary: "Una orden sin comisión COD (cantidad ausente = 1)"
                value:
                  provincia: San José
                  canton: Central
                  distrito: Carmen
                  monto_cobrar: "25000.00"
                  cobra_comision: false
      responses:
        "200":
          description: "Cotización resuelta. Con cobertura de exactamente una zona trae los costos; con 0 o >1 zonas trae `costos: null`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CotizacionResponse"
              examples:
                conComision:
                  summary: "Tres órdenes, tarifa vigente, con comisión COD"
                  value:
                    cobertura:
                      estado: cubierto
                      zonaNombre: GAM
                    tarifaVigente: true
                    cantidad: 3
                    montoCobrar: "25000.00"
                    cobraComision: true
                    supuesto: las 3 órdenes comparten distrito y monto a cobrar
                    escenarios:
                      entregada:
                        unitario:
                          flete: "2200.00"
                          ivaFlete: "286.00"
                          comisionCod: "875.00"
                          ivaComisionCod: "113.75"
                          costoTotal: "3474.75"
                          netoTienda: "21525.25"
                        total:
                          flete: "6600.00"
                          ivaFlete: "858.00"
                          comisionCod: "2625.00"
                          ivaComisionCod: "341.25"
                          costoTotal: "10424.25"
                          netoTienda: "64575.75"
                      devuelta:
                        unitario:
                          fleteDevolucion: "1500.00"
                          ivaFleteDevolucion: "195.00"
                          costoTotal: "1695.00"
                          netoTienda: "-1695.00"
                        total:
                          fleteDevolucion: "4500.00"
                          ivaFleteDevolucion: "585.00"
                          costoTotal: "5085.00"
                          netoTienda: "-5085.00"
                sinComision:
                  summary: "Con `cobra_comision: false`: comisionCod e ivaComisionCod se OMITEN (no van en \"0.00\")"
                  value:
                    cobertura:
                      estado: cubierto
                      zonaNombre: GAM
                    tarifaVigente: true
                    cantidad: 1
                    montoCobrar: "25000.00"
                    cobraComision: false
                    supuesto: la cotización corresponde a 1 orden con ese distrito y ese monto a cobrar
                    escenarios:
                      entregada:
                        unitario:
                          flete: "2200.00"
                          ivaFlete: "286.00"
                          costoTotal: "2486.00"
                          netoTienda: "22514.00"
                        total:
                          flete: "2200.00"
                          ivaFlete: "286.00"
                          costoTotal: "2486.00"
                          netoTienda: "22514.00"
                      devuelta:
                        unitario:
                          fleteDevolucion: "1500.00"
                          ivaFleteDevolucion: "195.00"
                          costoTotal: "1695.00"
                          netoTienda: "-1695.00"
                        total:
                          fleteDevolucion: "1500.00"
                          ivaFleteDevolucion: "195.00"
                          costoTotal: "1695.00"
                          netoTienda: "-1695.00"
                sinTarifaVigente:
                  summary: "La tienda no tiene tarifa vigente: `tarifaVigente: false` y todo en \"0.00\" (no es «gratis»)"
                  value:
                    cobertura:
                      estado: cubierto
                      zonaNombre: GAM
                    tarifaVigente: false
                    cantidad: 1
                    montoCobrar: "25000.00"
                    cobraComision: true
                    supuesto: la cotización corresponde a 1 orden con ese distrito y ese monto a cobrar
                    escenarios:
                      entregada:
                        unitario:
                          flete: "0.00"
                          ivaFlete: "0.00"
                          comisionCod: "0.00"
                          ivaComisionCod: "0.00"
                          costoTotal: "0.00"
                          netoTienda: "25000.00"
                        total:
                          flete: "0.00"
                          ivaFlete: "0.00"
                          comisionCod: "0.00"
                          ivaComisionCod: "0.00"
                          costoTotal: "0.00"
                          netoTienda: "25000.00"
                      devuelta:
                        unitario:
                          fleteDevolucion: "0.00"
                          ivaFleteDevolucion: "0.00"
                          costoTotal: "0.00"
                          netoTienda: "0.00"
                        total:
                          fleteDevolucion: "0.00"
                          ivaFleteDevolucion: "0.00"
                          costoTotal: "0.00"
                          netoTienda: "0.00"
                coberturaNoResuelta:
                  summary: "El distrito no resuelve exactamente una zona: sin bloque de costos"
                  value:
                    cobertura:
                      estado: no_determinado
                    costos: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key con prefijo `ordx_` en el header `Authorization: Bearer ordx_...`."
  schemas:
    Error:
      type: object
      description: "Shape uniforme de error del manejador global (feature 10). `status` siempre `\"error\"`."
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL
          description: Código estable (independiente del status HTTP).
        message:
          type: string
          description: Mensaje fijo en español.
        details:
          type: object
          description: "Detalle opcional. En 422 lleva `fieldErrors` (campo -> lista de errores)."
          additionalProperties: true
    OrdenListItem:
      type: object
      description: Item público de una orden propia (sin ids internos ni PII de terceros).
      required:
        - numGuia
        - numRemision
        - estado
        - destinatario
        - telefonoDest
        - producto
        - direccion
        - montoCobrar
        - createdAt
      properties:
        numGuia:
          type:
            - integer
            - "null"
          description: Número de guía (null si aún no asignado).
        numRemision:
          type: string
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
        destinatario:
          type: string
        telefonoDest:
          type: string
        producto:
          type: string
        direccion:
          type:
            - string
            - "null"
        montoCobrar:
          type:
            - number
            - "null"
          description: Monto a cobrar (COD).
        createdAt:
          type: string
          format: "date-time"
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Total de órdenes que cumplen el filtro.
    Listado:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrdenListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Evidencia:
      type: object
      description: Evidencia de entrega/rechazo con URL firmada de corta duración.
      required:
        - resultado
        - contentType
        - url
        - expiraEnSegundos
      properties:
        resultado:
          type: string
          enum:
            - entregada
            - rechazada
        contentType:
          type:
            - string
            - "null"
          description: MIME del archivo (p. ej. image/jpeg).
        url:
          type: string
          format: uri
          description: URL firmada (vence a los 5 min).
        expiraEnSegundos:
          type: integer
          description: TTL de la URL firmada en segundos (300).
    OrdenDetalle:
      allOf:
        - $ref: "#/components/schemas/OrdenListItem"
        - type: object
          required:
            - evidencias
          properties:
            evidencias:
              type: array
              description: "Evidencias de la orden ([] si no hay)."
              items:
                $ref: "#/components/schemas/Evidencia"
    CargaRequest:
      type: object
      required:
        - ordenes
      properties:
        ordenes:
          type: array
          minItems: 1
          maxItems: 5000
          description: Filas a cargar (1..5000). Todos los valores son texto.
          items:
            $ref: "#/components/schemas/CargaRow"
    CargaRow:
      type: object
      description: "Una fila de carga. Todas las claves son strings. Las requeridas se validan en el servidor; una fila inválida no aborta el lote (se reporta como `error`)."
      required:
        - num_remision
        - destinatario
        - telefono
        - provincia
        - canton
        - distrito
        - direccion
        - producto
        - peso
        - monto_cobrar
      properties:
        num_remision:
          type: string
          description: Identificador de remisión (dedup por este valor).
        destinatario:
          type: string
        telefono:
          type: string
        provincia:
          type: string
        canton:
          type: string
        distrito:
          type: string
        direccion:
          type: string
        producto:
          type: string
        peso:
          type: string
          description: "Peso en kg como texto (p. ej. \"1.5\")."
        monto_cobrar:
          type: string
          description: "Monto COD como texto (p. ej. \"25.90\")."
        notas:
          type: string
      additionalProperties:
        type: string
    CargaRowResult:
      type: object
      description: Resultado por fila del lote.
      required:
        - fila
        - numRemision
        - resultado
      properties:
        fila:
          type: integer
          description: "Índice 1-based dentro de `ordenes`."
        numRemision:
          type: string
        resultado:
          type: string
          enum:
            - creada
            - duplicada
            - error
        estatus:
          type: string
          description: Estado (en creada/duplicada); nunca ids internos.
        numGuia:
          type: integer
          description: "Número de guía asignado (solo en `creada`)."
        errores:
          type: object
          description: "Errores por campo (solo en `error`)."
          additionalProperties:
            type: array
            items:
              type: string
    CargaOrden:
      type: object
      description: Una orden efectivamente creada (bloque plano listo para consumir).
      required:
        - id
        - numRemision
        - numGuia
        - estado
        - costoEnvio
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de la orden creada.
        numRemision:
          type: string
        numGuia:
          type: integer
        estado:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
        costoEnvio:
          type: string
          description: "Costo del envío (flete + IVA), string escala 2. \"0.00\" si la tienda no tiene tarifa vigente. Distinto de `monto_cobrar`/COD."
    CargaResponse:
      type: object
      required:
        - total
        - creadas
        - duplicadas
        - conError
        - filas
        - ordenes
      properties:
        cargaId:
          type:
            - string
            - "null"
          format: uuid
          description: "Id del lote creado, para pedir después el PDF consolidado. `null` si el lote no creó ninguna orden."
        total:
          type: integer
          description: Filas recibidas.
        creadas:
          type: integer
        duplicadas:
          type: integer
        conError:
          type: integer
        filas:
          type: array
          items:
            $ref: "#/components/schemas/CargaRowResult"
        ordenes:
          type: array
          items:
            $ref: "#/components/schemas/CargaOrden"
    CancelacionResponse:
      type: object
      required:
        - numGuia
        - estadoAnterior
        - estado
      properties:
        numGuia:
          type: integer
        estadoAnterior:
          type: string
          enum:
            - entregada
            - devuelta
            - devolviendo_a_tienda
            - reprogramada
            - por_recolectar_en_tienda
            - en_ruta_bodega_central
            - en_bodega_central
            - en_preparacion
            - por_recoger
            - en_ruta_bodega_satelite
            - en_reparto
            - rechazada
            - en_bodega_satelite
            - devuelta_a_tienda
        estado:
          type: string
          const: devolviendo_a_tienda
    PdfGenerateResponse:
      type: object
      description: "URL firmada de corta duración con el PDF de etiqueta (de una orden o de un lote). La URL se firma en cada llamada: nunca es una URL persistida."
      required:
        - url
        - expiraEnSegundos
        - generado
      properties:
        url:
          type: string
          format: uri
          description: URL firmada del PDF.
        expiraEnSegundos:
          type: integer
          description: "TTL de la URL firmada en segundos (300 por defecto)."
        generado:
          type: boolean
          description: "`true` si el PDF se construyó en esta llamada; `false` si se reutilizó el ya almacenado y solo se volvió a firmar."
    CotizacionRequest:
      type: object
      description: "Entrada de la cotización. La geografía se identifica **por nombre** (el mismo trío con el que la carga por API crea órdenes), no por uuid. **No hay ninguna clave de tienda**: la tienda es la dueña de la API key, y una clave así en el cuerpo se ignora."
      required:
        - provincia
        - canton
        - distrito
        - monto_cobrar
      properties:
        provincia:
          type: string
          minLength: 1
          description: Nombre de la provincia.
        canton:
          type: string
          minLength: 1
          description: "Nombre del cantón, dentro de esa provincia."
        distrito:
          type: string
          minLength: 1
          description: "Nombre del distrito, dentro de ese cantón."
        monto_cobrar:
          type: string
          pattern: '^\d{1,12}(\.\d{1,2})?$'
          example: "25000.00"
          description: "Monto a cobrar (COD) **por orden**, como CADENA con hasta 2 decimales (p. ej. \"25000.00\"). Nunca un número: el dinero no viaja en punto flotante. Sobre él se calcula la comisión COD."
        cantidad:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: "Cantidad de órdenes a cotizar (entero 1..1000; ambos extremos se aceptan). **Ausente vale 1.** Fuera de rango o no entero devuelve 422 sin cotizar. Con N > 1 aplica el supuesto de homogeneidad: las N órdenes comparten distrito y monto a cobrar."
        cobra_comision:
          type: boolean
          default: true
          description: "Si la tienda paga comisión COD sobre el monto cobrado. **Ausente vale `true`**, que es el caso caro (añade comisión COD + su IVA): una cotización que se equivoca hacia arriba no da sorpresas al alza, porque la factura posterior será menor o igual a lo cotizado. Con `false`, el escenario `entregada` **omite** `comisionCod` e `ivaComisionCod` (no los emite en \"0.00\")."
    CoberturaBloque:
      type: object
      description: "Cobertura del distrito consultado. Nunca publica el id de la zona ni su flag interno de zona central: solo el estado y, si está cubierto, el **nombre** de la zona."
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - cubierto
            - sin_cobertura
            - no_determinado
          description: "`cubierto`: el distrito resuelve exactamente una zona. `sin_cobertura`: ninguna. `no_determinado`: más de una zona, así que no se deriva ninguna (no se elige una arbitraria)."
        zonaNombre:
          type: string
          description: "Nombre de la zona que cubre el distrito. Presente SOLO con `estado: \"cubierto\"`."
    ImportesEntregada:
      type: object
      description: |-
        Desglose del escenario **ENTREGADA**, con los cuatro conceptos por separado. Todos los
        valores son cadenas de escala 2.

        `comisionCod` e `ivaComisionCod` **se OMITEN** cuando la cotización va con
        `cobra_comision: false`: no se emiten en "0.00", porque un concepto ausente y uno en
        cero no dicen lo mismo.
      required:
        - flete
        - ivaFlete
        - costoTotal
        - netoTienda
      properties:
        flete:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "2200.00"
          description: "Flete de la zona del distrito, según la tarifa vigente de la tienda."
        ivaFlete:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "286.00"
          description: IVA del flete.
        comisionCod:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "875.00"
          description: "Comisión COD (porcentaje sobre el monto a cobrar). **Ausente** si `cobra_comision` es `false`."
        ivaComisionCod:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "113.75"
          description: "IVA de la comisión COD. **Ausente** si `cobra_comision` es `false`."
        costoTotal:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "3474.75"
          description: "Suma de los conceptos presentes: lo que Ordenex factura si la orden se entrega."
        netoTienda:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "21525.25"
          description: "Lo que recibe la tienda: monto a cobrar menos (flete + IVA) menos (comisión COD + IVA de la comisión). Este sí es el número que el cierre paga."
    ImportesDevuelta:
      type: object
      description: |-
        Desglose del escenario **DEVUELTA**: flete de devolución y su IVA. Sin comisión COD, sin
        IVA de comisión y sin monto COD a recibir, porque una devolución no recauda.
      required:
        - fleteDevolucion
        - ivaFleteDevolucion
        - costoTotal
        - netoTienda
      properties:
        fleteDevolucion:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "1500.00"
          description: "Flete de devolución de la zona, según la tarifa vigente de la tienda."
        ivaFleteDevolucion:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "195.00"
          description: IVA del flete de devolución.
        costoTotal:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "1695.00"
          description: "Flete de devolución + su IVA: lo que cuesta que la orden vuelva."
        netoTienda:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "-1695.00"
          description: |-
            **NEGATIVO**, igual a `-(fleteDevolucion + ivaFleteDevolucion)`.

            **⚠ Este número NO EXISTE EN EL CIERRE y no debe cuadrarse contra ninguna línea de
            cierre.** Es un número **del cotizador** («cuánto te cuesta si vuelve»), no un asiento:
            el pago a la tienda **no descuenta el flete de devolución**, porque una devolución no
            recauda COD y por tanto no aporta al total general.
    EscenarioEntregada:
      type: object
      description: "El escenario ENTREGADA publicado dos veces: por orden (`unitario`) y por las N (`total`)."
      required:
        - unitario
        - total
      properties:
        unitario:
          $ref: "#/components/schemas/ImportesEntregada"
        total:
          $ref: "#/components/schemas/ImportesEntregada"
    EscenarioDevuelta:
      type: object
      description: "El escenario DEVUELTA publicado dos veces: por orden (`unitario`) y por las N (`total`)."
      required:
        - unitario
        - total
      properties:
        unitario:
          $ref: "#/components/schemas/ImportesDevuelta"
        total:
          $ref: "#/components/schemas/ImportesDevuelta"
    EscenarioCotizacion:
      type: object
      description: |-
        Los dos escenarios de la cotización, en la misma respuesta. En cada uno, el `total` es
        el valor `unitario` **ya redondeado** multiplicado por la `cantidad`, no el redondeo
        final de una multiplicación sin redondear: así es como el cierre acumula los importes
        orden por orden.
      required:
        - entregada
        - devuelta
      properties:
        entregada:
          $ref: "#/components/schemas/EscenarioEntregada"
        devuelta:
          $ref: "#/components/schemas/EscenarioDevuelta"
    CotizacionConCostos:
      type: object
      description: "Cotización con costos: el distrito resolvió exactamente una zona, así que hubo tarifa que leer."
      required:
        - cobertura
        - tarifaVigente
        - cantidad
        - montoCobrar
        - cobraComision
        - supuesto
        - escenarios
      properties:
        cobertura:
          $ref: "#/components/schemas/CoberturaBloque"
        tarifaVigente:
          type: boolean
          description: |-
            `false` cuando la tienda no tiene tarifa vigente: en ese caso todos los conceptos
            van en "0.00", y esta bandera existe para que ese cero **no se lea como «gratis»**.

            **Deuda heredada, declarada:** la tarifa cotizada es la más reciente **no borrada** de
            la tienda; el resolver **no filtra por `tarifas.status`**, así que **una tarifa marcada
            `inactivo` que no haya sido borrada puede cotizarse**. Es la misma tarifa que aplicaría
            el cierre hoy: el cotizador hereda esa deuda, no la introduce.
        cantidad:
          type: integer
          minimum: 1
          maximum: 1000
          description: "Eco de la cantidad aplicada (1 si el parámetro vino ausente)."
        montoCobrar:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "25000.00"
          description: "Eco del monto a cobrar aplicado, normalizado a escala 2."
        cobraComision:
          type: boolean
          description: "Eco del parámetro `cobra_comision` aplicado, con su default `true` ya resuelto: leyéndolo se sabe qué se cotizó sin adivinar."
        supuesto:
          type: string
          example: las 3 órdenes comparten distrito y monto a cobrar
          description: |-
            **Supuesto de homogeneidad** de la cotización múltiple, en texto: las N órdenes
            comparten **distrito y monto a cobrar**. Sin él, un integrador multiplicaría una
            canasta heterogénea y la comisión COD saldría mal: es un porcentaje del monto, así
            que N montos distintos NO son una multiplicación.
        escenarios:
          $ref: "#/components/schemas/EscenarioCotizacion"
    CotizacionSinCostos:
      type: object
      description: "Cotización sin costos: el distrito no resolvió exactamente una zona (ninguna, o varias), así que no se eligió una zona arbitraria y no se leyó ninguna tarifa."
      required:
        - cobertura
        - costos
      properties:
        cobertura:
          $ref: "#/components/schemas/CoberturaBloque"
        costos:
          type: "null"
          description: "Siempre `null` en esta variante: no hay bloque `escenarios`."
    CotizacionResponse:
      oneOf:
        - $ref: "#/components/schemas/CotizacionConCostos"
        - $ref: "#/components/schemas/CotizacionSinCostos"
      description: "Respuesta de la cotización: con costos si la cobertura resolvió una zona, o con `costos: null` si no."
  responses:
    Unauthorized:
      description: "API key ausente, mal formada o desconocida."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: UNAUTHORIZED
            message: No hay una sesion valida.
    Forbidden:
      description: El usuario dueño de la key no está activo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: FORBIDDEN
            message: No tienes permiso para realizar esta accion.
    NotFound:
      description: La orden no existe o pertenece a otro dueño (mismo 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: NOT_FOUND
            message: El recurso solicitado no existe.
    Conflict:
      description: El estado actual de la orden no permite la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: CONFLICT
            message: La operacion entra en conflicto con el estado actual.
    ValidationError:
      description: "Entrada inválida (query, path o cuerpo)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: VALIDATION_ERROR
            message: Los datos enviados no son validos.
            details:
              fieldErrors:
                limit:
                  - Number must be less than or equal to 100
